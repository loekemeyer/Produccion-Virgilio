<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e6bd6">
<title>Reporte Empleados</title>
<!-- PWA: manifiesto + ícono. Permite "Agregar a pantalla de inicio" en Chrome
     Android y mejora la fiabilidad del Background Sync del Service Worker. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 12px; overflow-x: hidden; }
html { overflow-x: hidden; }
.hidden { display: none; }

button {
  width: 100%;
  padding: 16px;
  font-size: 22px;
  margin-top: 14px;
  border-radius: 6px;
}

.primary-btn { background: #1e6bd6; color: white; border: none; }

/* ---------- PANTALLA LEGAJO ---------- */
#legajoScreen h1 { font-size: 36px; text-align: center; }
#legajoInput { width: 100%; font-size: 34px; padding: 12px; text-align: center; border: 6px solid; }

/* 👇 espacio donde se verá el historial (ACHICADO) */
#legajoHistorySpace{
  margin-top: 12px;
  min-height: 25vh;
  border-radius: 10px;
  padding: 12px;
  box-sizing: border-box;
}

/* Estilo del historial */
.history-title{
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 10px;
}
.history-item{
  border: 2px solid #333;
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.history-item .line1{
  font-size: 18px;
  font-weight: bold;
}
.history-item .line2{
  margin-top: 4px;
  font-size: 14px;
  color: #333;
  word-break: break-word;
}
.history-empty{
  font-size: 16px;
  text-align: center;
  color: #666;
  margin-top: 18px;
}

.row { display: grid; gap: 8px; margin-top: 13px; }
.row-6 { grid-template-columns: repeat(6, 1fr); }
.row-5 { grid-template-columns: repeat(5, 1fr); }
.row-4 { grid-template-columns: repeat(4, 1fr); }

.box { border: 2px solid #333; padding: 8px 4px; text-align: center; cursor: pointer; }
.box-title { font-size: 18px; font-weight: bold; }
.box-desc { font-size: 10px; margin-top: 3px; }

.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.back-top { font-size: 28px; cursor: pointer; }

/* Botón rojo "Terminar Día" en la barra superior de la pantalla de opciones */
#btnTerminarDia{
  background: #dc2626;
  color: #fff;
  border: 2px solid #991b1b;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 0;
  width: auto;
  line-height: 1;
}

.selected-container { display: flex; align-items: center; justify-content: center; margin-top: 16px; }
.back-arrow { font-size: 32px; cursor: pointer; margin-right: 10px; }
.selected-box { border: 2px solid #333; padding: 10px 22px; font-size: 28px; font-weight: bold; color: #1e6bd6; }
.selected-desc { margin-left: 12px; font-size: 18px; font-weight: bold; }

.label { margin-top: 14px; font-size: 22px; text-align: center; white-space: pre-line; }

/* Label + input + botón Enviar en línea, todos juntos a la izquierda. */
.label-send-row{
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 14px;
  margin-top: 14px;
  flex-wrap: wrap;       /* en celular angosto, baja a 2 filas */
}
.label-send-row #inputLabel{
  margin-top: 0;
  text-align: left;
  flex: 0 0 auto;        /* label al ancho de su contenido */
  white-space: nowrap;
}
.label-send-row #textInput{
  flex: 0 0 auto;        /* ancho fijo */
  width: 7ch;            /* aprox 6 caracteres + margen para que respire */
  min-width: 0;
  margin-top: 0;
}
.primary-btn-inline{
  width: auto !important;
  min-width: 140px;
  padding: 16px 32px !important;
  margin-top: 0 !important;
  font-size: 26px !important;
  font-weight: bold;
  flex: 0 0 auto;
}

.text-input {
  width: 100%;
  height: 48px;
  font-size: 32px;
  border: 3px solid;
  text-align: center;
  margin-top: 6px;
  text-transform: uppercase;
}
.text-input::placeholder { font-size: 18px; color: #aaa; }

/* Lista de tandas planificadas (PPP) — boxes con ancho fijo (4 chars),
   agrupados por fecha de entrega. */
#tandasList{
  margin-top: 12px;
}
#tandasList.hidden{ display: none; }
/* Contenedor que pone los grupos de días lado a lado cuando entran en la
   misma fila (optimizado para celular: 26/05 con 1 chip y 28/05 con 2 caben
   juntos en una sola fila). */
.tandas-day-grid{
  display: flex;
  flex-wrap: wrap;
  gap: 14px 18px;
  align-items: flex-start;
}
.tandas-day-group{
  margin-bottom: 0;
  /* Recuadro que agrupa visualmente fecha + chips de ese día */
  border: 2px solid #cbd5e1;
  border-radius: 10px;
  padding: 8px 10px 10px 10px;
  background: #fff;
}
.tandas-day-header{
  font-size: 16px;
  font-weight: bold;
  color: #1e6bd6;
  margin-bottom: 6px;
}
.tandas-chips{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tanda-chip{
  /* Override del global "button { width:100%; margin-top:14px; padding:16px }". */
  width: auto;
  min-width: 72px;
  margin-top: 0;
  margin-bottom: 0;
  text-align: center;
  background: #e0f2fe;
  border: 2px solid #1e6bd6;
  color: #1e6bd6;
  padding: 10px 6px;
  border-radius: 8px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  font-family: Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
.tanda-chip:active{
  background: #1e6bd6;
  color: #fff;
  transform: scale(0.96);
}
.tandas-list-empty,
.tandas-list-label{
  font-size: 14px;
  color: #999;
  font-style: italic;
}
/* Botón "Ver más días" cuando hay más de 3 fechas */
.tandas-more-btn{
  width: auto;
  min-width: 0;
  margin-top: 8px;
  background: #f1f5f9;
  border: 2px dashed #94a3b8;
  color: #475569;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  display: inline-block;
}
.tandas-more-btn:active{
  background: #e2e8f0;
}

.error { color: red; margin-top: 10px; font-size: 18px; text-align: center; }
.small { font-size: 14px; color: #666; text-align:center; margin-top:6px; }
.aviso-label{
 margin-top:10px;
 padding:8px 12px;
 background:#fff3cd;
 border:1px solid #ffeeba;
 border-radius:6px;
 font-size:30px;
 text-align:center;
}

/* ✅ deshabilitado visual */
.box.disabled{
  background:#ddd;
  color:#888;
  border-color:#aaa;
  pointer-events:none;
  opacity:0.6;
}

/* ⚠ tarea pendiente: hay un EP/AP o toggle abierto sin cerrar.
   El botón correspondiente queda con borde rojo. Si está además
   disabled (por bloqueo), gana el borde rojo igual. */
.box.pending{
  border-color: #d33;
  background: #fff5f5;
}
.box.disabled.pending,
.box.pending.disabled{
  border-color: #d33;
  background: #ddd;
}

/* Banner "Deshacer último mensaje" — visible 60s después de send() */
#undoBanner{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  padding: 12px 14px;
  background: #fef3c7;
  border: 2px solid #f59e0b;
  border-radius: 8px;
  font-size: 16px;
  color: #92400e;
  font-weight: bold;
}
#undoBanner.hidden{ display: none; }
#undoBannerText{
  flex: 1 1 auto;
  min-width: 0;
}
.undo-btn{
  width: auto !important;
  min-width: 0 !important;
  padding: 8px 18px !important;
  margin: 0 !important;
  background: #dc2626;
  color: #fff;
  border: 2px solid #991b1b;
  border-radius: 6px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  flex: 0 0 auto;
}
.undo-btn:active{ background: #991b1b; }

/* ✅ aviso de reportes pendientes (se reintenta solo en background) */
#pendingIndicator{
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: #ffe0e0;
  border: 2px solid #d33;
  border-radius: 8px;
  font-size: 18px;
  text-align: center;
  color: #900;
  font-weight: bold;
}

/* Resumen de hoy: lista scrolleable con todos los reportes del día */
.history-list{
  max-height: 360px;
  overflow-y: auto;
  text-align: left;
}

/* Botón flotante 📅 (historial de días anteriores) */
#btnHistDias{
  position: fixed;
  top: 12px;
  right: 12px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid #cbd5e1;
  background: #f8fafc;
  font-size: 22px;
  cursor: pointer;
  z-index: 100;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Override del .hidden global: el ID es más específico que la clase,
   así que sin esta regla el botón queda visible en la pantalla de tareas. */
#btnHistDias.hidden { display: none; }

/* Botón flotante 📊 (monitor de operarios — supervisor) */
#btnMonitor{
  position: fixed;
  bottom: 12px;
  left: 12px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid #cbd5e1;
  background: #f8fafc;
  font-size: 22px;
  cursor: pointer;
  z-index: 100;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#btnMonitor.hidden { display: none; }

/* Modal monitor */
#monitorModal{
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-start;
  justify-content: center;
  padding: 16px 4px;
  overflow: hidden;          /* sin scroll del modal */
}
#monitorModal.show{ display: flex; }
.monitor-card{
  background: #fff;
  border-radius: 12px;
  padding: 0 10px 14px 10px;
  width: 100%;
  max-width: 900px;
  max-height: 96vh;
  overflow: hidden;          /* sin scroll de la card */
  box-sizing: border-box;
}
.monitor-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
  background: #fff;
  padding: 12px 0 10px 0;
  margin: 0 0 8px 0;
  border-bottom: 1px solid #e5e7eb;
}
.monitor-title{ font-size: 18px; font-weight: bold; }

/* Reloj en el header del monitor — formato "ddd dd/mm HH:MM" */
#monitorClock{
  font-family: Arial, monospace;
  font-size: 14px;
  font-weight: bold;
  color: #1e6bd6;
  white-space: nowrap;
  margin: 0 12px;
  align-self: center;
}
#monitorModal.tv #monitorClock{
  font-size: clamp(18px, 2.4vh, 32px);
  color: #f8fafc;
}

/* QR de fichada — abajo a la derecha, solo visible cuando el monitor está
   abierto. La regla #monitorModal.show ~ #qrFichadaBox hace el override. */
#qrFichadaBox{
  display: none;
  position: fixed;
  bottom: 8px;
  right: 8px;
  z-index: 250;          /* sobre el modal del monitor (z-index 200) */
  background: #fff;
  border: 2px solid #1e6bd6;
  border-radius: 8px;
  padding: 6px 8px 8px 8px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
#monitorModal.show ~ #qrFichadaBox{
  display: block;
}
#qrFichadaBox .qr-label{
  font-size: 12px;
  font-weight: bold;
  color: #1e6bd6;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
#qrFichadaBox #qrCanvas{
  display: block;
  margin: 0 auto;
  width: 180px;
  height: 180px;
}
#qrFichadaBox .qr-countdown{
  font-size: 11px;
  color: #666;
  margin-top: 4px;
}
#qrFichadaBox #qrSecs{ color: #1e6bd6; }
/* En modo TV (monitor fullscreen abierto), agrandar el QR para que se
   escanee desde lejos. */
#monitorModal.tv.show ~ #qrFichadaBox #qrCanvas{
  width: clamp(180px, 16vh, 260px);
  height: clamp(180px, 16vh, 260px);
}
.monitor-meta{ font-size: 11px; color: #666; margin-top: 2px; }
.monitor-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.monitor-table th{
  background: #f1f5f9;
  text-align: left;
  padding: 8px 6px;
  font-size: 12px;
  border-bottom: 2px solid #cbd5e1;
  position: sticky;
  top: 60px;
  z-index: 5;
}
.monitor-table td{
  padding: 8px 6px;
  border-bottom: 1px solid #eef2f7;
  vertical-align: middle;
}
.monitor-table td.center, .monitor-table th.center{ text-align: center; }
.monitor-table td.num, .monitor-table th.num{ text-align: right; font-variant-numeric: tabular-nums; }
.monitor-tanda{ font-weight: bold; color: #1e6bd6; }
/* Celda de estado del monitor (Picking / Pedido Separado): grid de 3 columnas
   (1fr | icono | 1fr) para que el ✅/⏰ quede centrado en la columna y el legajo
   del que empezó vaya a la derecha SIN pisar el icono (cada uno en su track). */
.status-wrap{ display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-width: 4.2em; }
.status-wrap .status-icon{ grid-column: 2; }
.monitor-legajo{
  grid-column: 3; justify-self: start; margin-left: 4px;
  font-size: 11px; color: #64748b; font-weight: 600; white-space: nowrap;
}
#monitorModal.tv .monitor-legajo{ color: #94a3b8; font-size: 0.8em; }
/* Leyenda de operarios — abajo de "Fuera de ventana", lista ordenada por legajo. */
.monitor-legend{
  margin-top: 10px; padding: 8px 10px; border-top: 1px solid #e2e8f0;
  font-size: 13px; color: #334155; line-height: 1.55;
}
.monitor-legend .legend-title{ font-weight: bold; color: #475569; margin-bottom: 3px; }
.monitor-legend .legend-item{ display: block; white-space: nowrap; }
.monitor-legend .legend-item b{ color: #1e6bd6; }
#monitorModal.tv .monitor-legend{ border-top-color: #334155; color: #cbd5e1; font-size: 0.9em; }
#monitorModal.tv .monitor-legend .legend-title{ color: #94a3b8; }
#monitorModal.tv .monitor-legend .legend-item b{ color: #60a5fa; }
.status-icon{ font-size: 20px; line-height: 1; }
.status-pend{ color: #94a3b8; }
.status-curso{ color: #d97706; }
.status-done{ color: #16a34a; }

/* Spinner segmentado (reemplaza al ⏰ para indicar "en curso") — 12 barras
   con opacity fade en cascada, da la ilusión de rotación. */
.status-spinner{
  display: inline-block;
  width: 1em;
  height: 1em;
  vertical-align: middle;
  line-height: 0;
}
.status-spinner svg{
  width: 100%;
  height: 100%;
  display: block;
}
.status-spinner rect{
  fill: currentColor;
  animation: spinner-fade 1.1s linear infinite;
}
@keyframes spinner-fade{
  0%, 100% { opacity: 0.15; }
  10%      { opacity: 1; }
}

/* Fila con algo en curso (EP o AP sin cerrar) — resaltada amarillo
   (DESACTIVADO POR AHORA — descomentar para volver al color amarillo/marrón) */
/* .monitor-table tr.row-curso td{ background: #fef9c3; } */
/* Fila con tanda trabajada pero sin Op=SI en PPP — alerta roja
   (DESACTIVADO POR AHORA: la columna "Fecha Salida" ya muestra (F Pk)
   como indicador; descomentar estos bloques para volver al rojo) */

.monitor-table tr.row-missing-si td{
  background: #fee2e2;
  color: #991b1b;
  font-weight: bold;
}
.monitor-table tr.row-curso.row-missing-si td{
  background: #fecaca;
  color: #7f1d1d;
}
*/

  background: #7f1d1d;
  color: #fecaca;

}
#monitorModal.tv .monitor-table tr.row-curso.row-missing-si td{
  background: #991b1b;
  color: #fee2e2;

/* Flash verde de 2s cuando una tanda cambia de estado (⏰ → ✅ o similar).
   Usado para que el supervisor mirando la TV note el cambio sin estar atento. */
@keyframes row-flash-anim {
  0%   { background-color: #22c55e; color: #052e16; }
  100% { background-color: transparent; color: inherit; }
}
.monitor-table tr.row-flash td{
  animation: row-flash-anim 2s ease-out;
}
#monitorModal.tv .monitor-table tr.row-flash td{
  animation: row-flash-anim 2s ease-out;
}
*/

/* monitor-totales-side ahora arma 2 columnas externas:
     col-boxes  → stack vertical de filas (hoy + 5 días anteriores), cada fila
                  es .totales-row con 3 boxes (Picking/Pedido/Empleados).
     col-fc     → stack vertical de FC card + Total por día card.
   Así las filas de días anteriores quedan justo debajo de la de hoy, aunque
   el FC card tenga muchas tandas y sea alto. */
.totales-col-boxes{
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
}
.totales-col-fc{
  /* FC y Total uno al lado del otro (no apilados) */
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: flex-start;
}
.totales-row{
  display: flex;
  gap: 8px;
  align-items: flex-start;
  flex-wrap: wrap;
}

/* Cuadro "Total por día" — a la derecha del card "Tandas a FC" */
.monitor-total-card{
  border: 2px solid #cbd5e1;
  border-radius: 8px;
  padding: 10px;
  background: #f8fafc;
}
.monitor-total-title{
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 8px;
  color: #1e6bd6;
}
.monitor-total-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.monitor-total-table td{
  padding: 4px 8px;
  border-bottom: 1px solid #eef2f7;
}
.monitor-total-table th{
  text-align: left;
  padding: 4px 8px;
  font-size: 11px;
  background: #f1f5f9;
  border-bottom: 1px solid #cbd5e1;
  color: #475569;
}
.monitor-total-table th.center, .monitor-total-table td.center{ text-align: center; }
.monitor-total-table th.num, .monitor-total-table td.num{
  text-align: right;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
  color: #1e6bd6;
}
/* Celdas mergeadas con rowspan: Fecha (izq) y Total (der). */
.monitor-total-table td[rowspan]{
  vertical-align: middle;
  border-right: 1px solid #cbd5e1;
}
.monitor-total-table td.total-cell{
  border-right: none;
  border-left: 1px solid #cbd5e1;
  font-size: 15px;
}
.monitor-total-table td.fecha-cell{ font-weight: bold; }

/* Color del M3 del camión según estado de armado:
   verde=todas armadas, naranja=algunas, rojo=ninguna.
   La celda Total (rowspan, del día) no se colorea — queda en azul. */
.monitor-total-table tr.tandas-done td.num:not(.total-cell){ color: #16a34a; }
.monitor-total-table tr.tandas-partial td.num:not(.total-cell){ color: #f97316; }
.monitor-total-table tr.tandas-pending td.num:not(.total-cell){ color: #dc2626; }

/* Total por día — modo TV */
#monitorModal.tv .monitor-total-card{
  background: #111827;
  border: 3px solid #334155;
  padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.5vh, 18px);
  color: #cbd5e1;
}
#monitorModal.tv .monitor-total-title{
  font-size: clamp(13px, 1.7vh, 22px);
  color: #94a3b8;
  margin-bottom: clamp(6px, 1vh, 10px);
}
#monitorModal.tv .monitor-total-table{
  font-size: clamp(14px, 2vh, 26px);
}
#monitorModal.tv .monitor-total-table td{
  border-bottom: 1px solid #334155;
}
#monitorModal.tv .monitor-total-table th{
  background: #1e293b;
  color: #cbd5e1;
  font-size: clamp(11px, 1.4vh, 18px);
  border-bottom: 2px solid #334155;
}
#monitorModal.tv .monitor-total-table td.num{
  color: #60a5fa;
  font-weight: 900;
  font-size: clamp(14px, 2vh, 24px);
}
#monitorModal.tv .monitor-total-table td.total-cell{
  font-size: clamp(16px, 2.4vh, 28px);
  border-left-color: #334155;
}
#monitorModal.tv .monitor-total-table td[rowspan]{
  border-right-color: #334155;
}
#monitorModal.tv .monitor-total-table td.fecha-cell{
  color: #cbd5e1;
}
/* Estados de armado en TV (tonos más claros para contraste sobre fondo dark) */
#monitorModal.tv .monitor-total-table tr.tandas-done td.num:not(.total-cell){ color: #22c55e; }
#monitorModal.tv .monitor-total-table tr.tandas-partial td.num:not(.total-cell){ color: #fb923c; }
#monitorModal.tv .monitor-total-table tr.tandas-pending td.num:not(.total-cell){ color: #ef4444; }

/* Card "+ Fuera de ventana" — tandas planificadas con Fecha Entrega
   posterior a la ventana visible (3 días). Click para expandir/colapsar. */
.beyond-card{
  border: 2px solid #cbd5e1;
  border-radius: 8px;
  padding: 8px 10px;
  background: #f8fafc;
  cursor: pointer;
  user-select: none;
  /* Vive debajo de la tabla — separación visual y ancho ajustado al contenido. */
  margin-top: 8px;
  width: fit-content;
  max-width: 100%;
}
.beyond-card:hover{ background: #f1f5f9; }
.beyond-summary{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.beyond-label{ font-weight: bold; color: #475569; }
.beyond-count{ color: #1e6bd6; font-weight: bold; }
.beyond-toggle{ margin-left: auto; transition: transform 0.2s; color: #94a3b8; }
.beyond-card.expanded .beyond-toggle{ transform: rotate(180deg); }
.beyond-detail{
  display: none;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #e2e8f0;
}
.beyond-card.expanded .beyond-detail{ display: block; }
.beyond-day{ margin-bottom: 8px; font-size: 12px; }
.beyond-day:last-child{ margin-bottom: 0; }
.beyond-day-header{ font-weight: bold; color: #1e6bd6; margin-bottom: 2px; }
.beyond-day-tandas{ color: #475569; word-break: break-all; line-height: 1.4; }

/* TV mode */
#monitorModal.tv .beyond-card{
  background: #111827;
  border: 3px solid #334155;
  padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.5vh, 18px);
  color: #cbd5e1;
}
#monitorModal.tv .beyond-card:hover{ background: #1f2937; }
#monitorModal.tv .beyond-summary{ font-size: clamp(13px, 1.7vh, 22px); }
#monitorModal.tv .beyond-label{ color: #94a3b8; }
#monitorModal.tv .beyond-count{ color: #60a5fa; }
#monitorModal.tv .beyond-toggle{ color: #94a3b8; }
#monitorModal.tv .beyond-detail{ border-top-color: #334155; }
#monitorModal.tv .beyond-day{ font-size: clamp(12px, 1.5vh, 20px); }
#monitorModal.tv .beyond-day-header{ color: #60a5fa; }
#monitorModal.tv .beyond-day-tandas{ color: #94a3b8; }

.monitor-totales{
  margin-top: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
/* POPUP MODE (PC normal): tabla arriba, totales en grid 2 cols abajo.
   En TV mode esto se sobreescribe a grid 50/50 lado a lado. */
.monitor-flex{ display: block; }
.monitor-flex .monitor-table-wrap{ width: 100%; overflow: visible; }
.monitor-flex .monitor-table{ width: 100%; }
.monitor-totales-side{
  margin-top: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
/* Alert mini abajo de los totales — ocupa ambas columnas en popup */
.monitor-totales-side .monitor-alerts{
  grid-column: 1 / -1;
  margin: 0;
  padding: 6px 10px;
  font-size: 11px;
  gap: 8px;
}
.monitor-totales-side .monitor-alert-title{ font-size: 11px; }
.monitor-totales-side .monitor-alert-chip{ font-size: 11px; padding: 2px 6px; }
.monitor-tot-box{
  border: 2px solid #cbd5e1;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}
.monitor-tot-label{ font-size: 12px; color: #555; }
.monitor-tot-value{ font-size: 22px; font-weight: bold; color: #1e6bd6; margin-top: 2px; }

/* Boxes de día (M3 Picking/Pedido/Empleados) clickeables → modal de
   rendimiento por operario. */
.day-box-clickable{
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}
.day-box-clickable:hover{
  box-shadow: 0 0 0 2px #60a5fa;
}
.day-box-clickable:active{
  transform: scale(0.97);
}
.monitor-loading{ text-align: center; padding: 40px 12px; color: #666; }

/* Banner de alertas — tandas trabajadas pero no en PPP */
.monitor-alerts{
  background: #fee2e2;
  border: 2px solid #dc2626;
  color: #7f1d1d;
  border-radius: 8px;
  padding: 10px 14px;
  margin: 0 0 10px 0;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.monitor-alert-title{
  font-size: 14px;
  font-weight: 900;
  flex-shrink: 0;
}
.monitor-alert-list{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
}
.monitor-alert-chip{
  background: #fff;
  color: #991b1b;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  border: 1px solid #991b1b;
}
#monitorModal.tv .monitor-totales-side .monitor-alerts{
  background: #450a0a;
  border-color: #ef4444;
  color: #fecaca;
  padding: clamp(6px, 0.8vh, 10px) clamp(8px, 0.6vw, 14px);
  gap: clamp(6px, 0.6vw, 12px);
  flex: 0 0 auto;
  margin: 0;
}
#monitorModal.tv .monitor-totales-side .monitor-alert-title{
  font-size: clamp(11px, 1.2vh, 16px);
  color: #fecaca;
}
#monitorModal.tv .monitor-totales-side .monitor-alert-chip{
  background: #fee2e2;
  color: #7f1d1d;
  font-size: clamp(11px, 1.2vh, 16px);
  padding: clamp(2px, 0.3vh, 5px) clamp(5px, 0.4vw, 9px);
  border: 1px solid #fee2e2;
}
.monitor-error{ background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 13px; }

/* Banner "sin conexión" — visible cuando los fetches fallan pero tenemos
   el último estado conocido en pantalla. */
#monitorOfflineBanner{
  background: #fef3c7;
  color: #92400e;
  border: 2px solid #f59e0b;
  border-radius: 8px;
  padding: 10px 14px;
  margin: 8px 0;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
}
#monitorOfflineBanner.hidden{ display: none; }
#monitorModal.tv #monitorOfflineBanner{
  background: #422006;
  color: #fde68a;
  border-color: #f59e0b;
  font-size: clamp(14px, 1.8vh, 22px);
  padding: clamp(8px, 1.2vh, 16px) clamp(10px, 1.2vw, 18px);
}
.monitor-refresh{
  font-size: 11px;
  color: #16a34a;
  margin-left: 8px;
}
.monitor-refresh.stale{ color: #d97706; }

/* Botón Modo TV en header del modal */
.btn-tv{
  background: #0f172a;
  color: #fff;
  border: 2px solid #0f172a;
  border-radius: 6px;
  font-size: 14px;
  padding: 6px 12px;
  cursor: pointer;
  margin-right: 6px;
}

/* =====================================================
   MOBILE — el monitor también se puede mirar desde un celu.
   Apilamos cosas verticalmente para no romper el layout.
   ===================================================== */
@media (max-width: 768px){
  /* Cuadros del monitor: una sola columna, no dos */
  .monitor-totales-side{
    grid-template-columns: 1fr;
  }
  /* FC + Total → apilados (no en fila como en desktop) */
  .totales-col-fc{
    flex-direction: column;
  }
  /* Las filas de boxes del día se acomodan con wrap */
  .totales-row{
    gap: 6px;
  }
  /* Cards más chicas */
  .monitor-fc-card,
  .monitor-total-card{
    width: 100%;
    box-sizing: border-box;
  }
  /* Header del monitor con más respiración */
  .monitor-title{ font-size: 16px; }
  .monitor-meta{ font-size: 10px; }
  /* Tabla SIN scroll horizontal — si no entra, se cortan las celdas. */
  .monitor-table-wrap{
    overflow: hidden;
  }
  /* Modal: padding chico para que el modal use casi todo el ancho */
  #monitorModal{ padding: 8px 4px; }
  .monitor-card{ padding: 0 6px 10px 6px; }
  .monitor-header{ padding: 8px 0 6px 0; }
}

/* =====================================================
   MODO TV — fullscreen adaptativo (no scroll).
   Tamaños en clamp(vh) para escalar de monitor chico a 32".
   ===================================================== */
#monitorModal.tv{
  padding: 0;
  background: #0b1220;
}
#monitorModal.tv .monitor-card{
  max-width: 100%;
  max-height: 100vh;
  height: 100vh;
  border-radius: 0;
  background: #0b1220;
  color: #e5e7eb;
  padding: 0 12px 12px 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#monitorModal.tv .monitor-header{
  background: #0b1220;
  border-bottom: 2px solid #1e293b;
  padding: clamp(8px, 1.2vh, 16px) 0;
  flex: 0 0 auto;
}
#monitorModal.tv .monitor-title{
  font-size: clamp(22px, 3.2vh, 44px);
  color: #f8fafc;
  letter-spacing: 0.5px;
}
#monitorModal.tv .monitor-meta{
  font-size: clamp(11px, 1.4vh, 18px);
  color: #94a3b8;
  margin-top: 2px;
}
#monitorModal.tv .monitor-refresh{
  font-size: clamp(12px, 1.5vh, 20px);
  color: #4ade80;
}
#monitorModal.tv .monitor-refresh.stale{ color: #facc15; }
#monitorModal.tv .btn-tv,
#monitorModal.tv .hist-modal-close{
  font-size: clamp(13px, 1.6vh, 20px);
  padding: clamp(8px, 1vh, 12px) clamp(12px, 1.5vw, 22px);
}
#monitorModal.tv .monitor-table{
  /* Estética tipo Excel: texto uniforme y compacto en toda la grilla.
     Subido ~30% respecto al draft anterior para mejorar legibilidad sin
     romper la proporción tabla/panel derecho. */
  font-size: clamp(17px, 2.4vh, 32px);
}
#monitorModal.tv .monitor-table th{
  background: #1e293b;
  color: #cbd5e1;
  font-size: clamp(17px, 2.3vh, 30px);
  /* Más alto que antes para que los headers de 2 líneas
     (Fecha/Salida, Pedido/Separado) respiren. */
  padding: clamp(14px, 2.1vh, 28px) clamp(3px, 0.3vw, 7px);
  line-height: 1.15;
  top: 0;
  border-bottom: 3px solid #334155;
}
#monitorModal.tv .monitor-table td{
  /* Padding horizontal apretado; vertical normal para que las filas respiren. */
  padding: clamp(3px, 0.55vh, 8px) clamp(3px, 0.3vw, 7px);
  line-height: 1.1;
  border-bottom: 1px solid #1e293b;
}
#monitorModal.tv .monitor-tanda{
  /* Tamaño heredado de .monitor-table (estilo Excel: texto uniforme).
     Solo conservamos color y bold para distinguir el código de tanda. */
  color: #60a5fa;
  font-weight: bold;
}
#monitorModal.tv .status-icon{
  /* Íconos ✅/⏰ al tamaño del texto de la tabla, estilo Excel compacto. */
  font-size: clamp(20px, 3.1vh, 42px);
  vertical-align: middle;
}
#monitorModal.tv .status-pend  { color: #475569; }
#monitorModal.tv .status-curso { color: #fbbf24; }
#monitorModal.tv .status-done  { color: #22c55e; }
#monitorModal.tv #monitorContent{
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
}
#monitorModal.tv .monitor-flex{
  display: grid;
  /* Izq: tabla al ancho de su contenido (estilo Excel, sin estirarse).
     Der: el resto del viewport para los cuadros de totales. */
  grid-template-columns: max-content 1fr;
  gap: 16px;
  width: 100%;
  height: 100%;
  align-items: stretch;
  min-height: 0;
}
#monitorModal.tv .monitor-table{
  /* Sobreescribe el width: 100% global — en TV la tabla se ajusta al
     contenido de sus columnas. */
  width: auto;
}
#monitorModal.tv .monitor-table-wrap{
  overflow: hidden;          /* sin scroll del wrapper de la tabla */
  min-height: 0;
  height: 100%;
}
#monitorModal.tv .monitor-flex .monitor-table{
  width: 100%;
}
#monitorModal.tv .monitor-flex .monitor-table thead th{
  position: sticky;
  top: 0;
  z-index: 5;
}
#monitorModal.tv .monitor-totales-side{
  flex: none;
  width: 100%;
  display: grid;
  /* 2 columnas externas al tamaño de su contenido:
       col-boxes (Picking/Pedido/Empleados de hoy + 5 días anteriores apilados)
       col-fc    (Tandas a FC + Total por día apilados)
     Los días anteriores quedan alineados verticalmente con la fila de hoy. */
  grid-template-columns: max-content max-content;
  gap: 8px;
  align-content: start;             /* pegados arriba */
  align-items: start;               /* cada cuadro = alto del contenido (no se estira) */
  justify-content: start;           /* y a la izquierda de la columna derecha */
  position: static;
  height: 100%;
}
#monitorModal.tv .monitor-tot-box{
  border: 3px solid #334155;
  background: #111827;
  /* Ancho justo para "del día 25/5" en una línea (≈ 13 chars). */
  padding: clamp(3px, 0.5vh, 7px) clamp(7px, 1.1vh, 13px);
  width: clamp(100px, 11vw, 165px);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: stretch;             /* label y value usan el ancho del box */
}
#monitorModal.tv .monitor-tot-label{
  /* Match con el header "Tanda" de la tabla (.monitor-table th en TV). */
  font-size: clamp(13px, 1.7vh, 22px);
  font-family: Arial, Helvetica, sans-serif;
  color: #94a3b8;
  margin-bottom: 2px;
  text-align: center;               /* "M3 Picking" centrado sobre "del día dd/mm" */
  /* No wrappear "Trabajando 23/05" en 2 líneas — si no entra, ellipsis. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#monitorModal.tv .monitor-tot-value{
  /* Match con los códigos de tanda tipo "C02D" (.monitor-tanda en TV). */
  font-size: clamp(20px, 3vh, 40px);
  font-family: Arial, Helvetica, sans-serif;
  color: #60a5fa;
  line-height: 1;
  font-weight: 900;
  text-align: center;               /* x,x centrado en el box */
}
#monitorModal.tv .monitor-error{ font-size: 22px; }
#monitorModal.tv .monitor-loading{ font-size: 24px; color: #94a3b8; }

/* Tandas a FC — bloque a la derecha con tandas ya terminadas (picking + separado).
   En el grid de .monitor-totales-side ocupa ambas columnas. */
.monitor-fc-card{
  border: 2px solid #cbd5e1;
  border-radius: 8px;
  padding: 10px;
  background: #f8fafc;
  /* Ocupa una sola celda del grid de .monitor-totales-side; el cuadro
     "Total por día" se ubica a la derecha en la otra celda. */
}
.monitor-fc-title{
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 8px;
  color: #166534;
}
.monitor-fc-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.monitor-fc-table th{
  text-align: left;
  padding: 4px 6px;
  background: #f1f5f9;
  font-size: 11px;
  border-bottom: 1px solid #cbd5e1;
  color: #475569;
}
.monitor-fc-table td{
  padding: 4px 6px;
  border-bottom: 1px solid #eef2f7;
}
.monitor-fc-table th.num, .monitor-fc-table td.num{ text-align: right; font-variant-numeric: tabular-nums; }
.monitor-fc-table th.center, .monitor-fc-table td.center{ text-align: center; }
.fc-tanda{
  font-weight: bold;
  color: #16a34a;
}

/* Tandas a FC — modo TV (verde oscuro, fuentes escaladas) */
#monitorModal.tv .monitor-fc-card{
  background: #052e16;
  border: 3px solid #166534;
  padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.5vh, 18px);
  color: #d1fae5;
}
#monitorModal.tv .monitor-fc-title{
  font-size: clamp(13px, 1.7vh, 22px);
  color: #86efac;
  margin-bottom: clamp(6px, 1vh, 10px);
}
#monitorModal.tv .monitor-fc-table{
  font-size: clamp(14px, 2vh, 26px);
}
#monitorModal.tv .monitor-fc-table th{
  background: #14532d;
  color: #bbf7d0;
  font-size: clamp(11px, 1.4vh, 18px);
  border-bottom: 2px solid #166534;
}
#monitorModal.tv .monitor-fc-table td{
  border-bottom: 1px solid #166534;
}
#monitorModal.tv .fc-tanda{
  color: #4ade80;
  font-weight: 900;
  font-size: clamp(16px, 2.4vh, 28px);
}

/* Celdas de código de tanda clickeables — abren modal con NPs + m3. */
.tanda-clickable{ cursor: pointer; }
.tanda-clickable:hover{ text-decoration: underline; }

/* Modal de detalle de tanda — z-index sobre el monitor (200) para que
   se vea por encima en modo TV. */
#tandaModal{
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.65);
  z-index: 300;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 8px;
  overflow-y: auto;
}
#tandaModal.show{ display: flex; }
.tanda-modal-card{
  background: #fff;
  border-radius: 12px;
  padding: 0 16px 16px 16px;
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  overflow-y: auto;
  box-sizing: border-box;
}
.tanda-modal-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
  background: #fff;
  padding: 16px 0 12px 0;
  margin: 0 0 12px 0;
  border-bottom: 1px solid #e5e7eb;
}
.tanda-modal-title{ font-size: 18px; font-weight: bold; color: #1e6bd6; }
.tanda-modal-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tanda-modal-table th{
  background: #f1f5f9;
  text-align: left;
  padding: 6px 8px;
  font-size: 11px;
  border-bottom: 2px solid #cbd5e1;
  color: #475569;
}
.tanda-modal-table td{
  padding: 6px 8px;
  border-bottom: 1px solid #eef2f7;
}
.tanda-modal-table th.num, .tanda-modal-table td.num{
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.tanda-modal-table th.center, .tanda-modal-table td.center{ text-align: center; }
/* Filas del modal de detalle de camión coloreadas según armado de cada tanda. */
.tanda-modal-table tr.tanda-armado td{ color: #16a34a; }
.tanda-modal-table tr.tanda-no-armado td{ color: #dc2626; }

/* Modales (historial de días anteriores y "Terminar Día") */
#histModal,
#terminarDiaModal{
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 8px;
  overflow-y: auto;
}
#histModal.show,
#terminarDiaModal.show{ display: flex; }
.hist-modal-card{
  background: #fff;
  border-radius: 12px;
  /* sin padding-top: el header sticky aporta el propio para que su fondo
     blanco cubra completamente la parte superior y nada "asome" arriba */
  padding: 0 16px 16px 16px;
  width: 100%;
  max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  box-sizing: border-box;
}
.hist-modal-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
  background: #fff;
  padding: 16px 0 12px 0;
  margin: 0 0 12px 0;
  border-bottom: 1px solid #e5e7eb;
}
.hist-modal-title{ font-size: 18px; font-weight: bold; }
.hist-modal-close{
  background: #eee;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
  padding: 6px 14px;
  cursor: pointer;
}
.hist-day-block{
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.hist-day-title{
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
  color: #1e6bd6;
}
.hist-day-item{
  font-size: 14px;
  padding: 6px 0;
  border-top: 1px solid #f0f0f0;
}
.hist-day-item:first-child{ border-top: none; }

/* Badge de estado por reporte (queued / sent / failed) */
.status-badge{
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: bold;
  margin-left: 6px;
  vertical-align: middle;
  line-height: 1.3;
}
.status-sent   { background: #d1fae5; color: #065f46; }
.status-failed { background: #fee2e2; color: #991b1b; }
.status-queued { background: #fef3c7; color: #92400e; }

/* Badge de versión y estado de sincronización (esquina inferior derecha) */
#versionBadge{
  position: fixed;
  bottom: 8px;
  right: 8px;      /* a la derecha — el QR solo aparece con el monitor abierto */
  z-index: 50;
  font-size: 12px;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 12px;
  background: #f0fdf4;
  color: #166534;
  border: 1px solid #bbf7d0;
  pointer-events: none;        /* no se puede tocar; es solo visual */
  font-family: monospace;
}
#versionBadge.pending{
  background: #fffbeb;
  color: #92400e;
  border-color: #fde68a;
}
#versionBadge.error{
  background: #fef2f2;
  color: #991b1b;
  border-color: #fecaca;
}

<body>

<!-- Botón flotante: historial de días anteriores -->
<button id="btnHistDias" title="Historial de días anteriores">📅</button>

<!-- Botón flotante: monitor de operarios (supervisor) -->
<button id="btnMonitor" title="Monitor de operarios" onclick="openMonitor()">📊</button>

<!-- Modal: monitor de operarios -->
<div id="monitorModal" onclick="if(event.target.id==='monitorModal') closeMonitor()">
  <div class="monitor-card">
    <div class="monitor-header">
      <div>
        <div class="monitor-title">Monitor Virgilio <span id="monitorRefresh" class="monitor-refresh"></span></div>
        <div class="monitor-meta" id="monitorMeta"></div>
      </div>
      <div id="monitorClock"></div>
      <div>
        <button class="hist-modal-close" onclick="closeMonitor()">Cerrar</button>
      </div>
    </div>

<script>
/* =========================================================
   SUPABASE
   Org "Gestion Productiva" / Proyecto "Control Partes Talleristas".
   La publishable key es pública por diseño (va embebida en la HTML
   servida por GitHub Pages). La RLS permite SOLO INSERT con esta key.
   ========================================================= */
const SUPABASE_URL  = "https://hrxfctzncixxqmpfhskv.supabase.co";
const SUPABASE_KEY  = "sb_publishable_BqpAgZH6ty-9wft10_YMhw_0rcIPuWT";
const SUPABASE_TABLE_ENDPOINT =
  SUPABASE_URL + "/rest/v1/Registros_Produccion_Virgilio";
/* Fichadas de ingreso vienen del QR (fichada.html → Supabase). El monitor
   las cruza con PC/FJ de Registros_Produccion_Virgilio para calcular
   jornada. Empleados se usa para resolver email→legajo cuando el QR no
   tenia legajo todavia (cuando un operario nuevo todavia no esta
   linkeado en la tabla). */
const SUPABASE_FICHADAS_ENDPOINT =
  SUPABASE_URL + "/rest/v1/Fichadas_Virgilio";
const SUPABASE_HISTORICO_ENDPOINT =
  SUPABASE_URL + "/rest/v1/Fichadas_Historico";
const SUPABASE_EMPLEADOS_ENDPOINT =
  SUPABASE_URL + "/rest/v1/Empleados";

const filas = {
  row1: ["EP","TP","AP","TAP","CR","CC"],
  row2: ["RT","MG","RI","EI","CT"],
  row3: ["AT","PB","Limp","Perm","PC"]
};

const desc = {
  EP:"Empecé Picking", TP:"Fin Picking", AP:"Empecé Armado Pedido",
  TAP:"Terminé Armado Pedido", CR:"Control Remitos", CC:"Inicio/Fin Carga Camión",
  RT:"Recepción Mercadería", MG:"Guardado a Góndola",
  RI:"Recepción Insumos", EI:"Entrega Insumos",
  AT:"Atendí Timbre", PB:"Paré Baño", Limp:"Limpieza",
  Perm:"Permiso de Salida", PC:"Paré Comida",CT:"Conteo"
};

let selected = null;

/* =========================================================
   STORAGE LOCAL — versiones e identificadores
   ========================================================= */
const STATE_KEY       = "legajo_state_virgilio_v1";
const HIST_V2_PREFIX  = "legajo_hist_virgilio_v2";        // keys: <prefix>::AAAA-MM-DD::<legajo>
const DAY_GUARD_KEY   = "legajo_day_guard_virgilio_v1";   // última fecha vista (hora Arg)
const LAST_LEGAJO_KEY = "legajo_last_virgilio_v1";        // último legajo usado en este celular

const TZ_AR           = "America/Argentina/Buenos_Aires";
const MAX_PROD_DAYS   = 10;        // se retienen N días PRODUCTIVOS (con datos), no calendario
const HIST_MAX_PER_DAY = 700;      // tope de reportes por día por legajo en localStorage
const SURVIVING_TOGGLES = ["CR","MG"]; // únicos toggles que sobreviven al cambio de día

/* Auto-cierre al fin de jornada para toggles abiertos que quedaron sin cerrar.
   Si la limpieza del día siguiente encuentra alguno de estos abierto, genera
   un registro de cierre con ts_cliente = fin de jornada del día en que se abrió.
   Incluye CC/RT/RI/EI: si el operario olvidó cerrarlos y pasó el día, generamos
   igual el cierre (con texto vacío). Lo normal es que los cierre Terminar Día
   con cantidad; este auto-cierre es solo red de seguridad para el caso raro. */
const WORKDAY_END_HOUR_AR = 17;    // 17:00 hora Argentina (la jornada termina ahí)
const AUTO_CLOSE_CODES    = ["AT","PB","Limp","PC","CT","Perm","CC","RT","RI","EI"];

/* Toggles que al cerrarse manualmente piden una cantidad/dato en el texto.
   En Terminar Día, los abiertos de este grupo abren un input en el modal y
   no se puede confirmar sin completar todos los campos. */
const CLOSE_NEEDS_INPUT_CODES = ["CC","RT","RI","EI"];

/* =========================================================
   FECHA / TIMESTAMP
   ========================================================= */
function getTodayKey() {
  // YYYY-MM-DD en hora de Buenos Aires (independiente de la TZ del dispositivo)
  const d = new Date(new Date().toLocaleString("en-US", { timeZone: TZ_AR }));
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function formatDateTime(ts) {
  try { return new Date(ts).toLocaleString("es-AR"); }
  catch { return ""; }
}
function formatDayLong(fecha) {
  const p = fecha.split("-");
  return `${p[2]}/${p[1]}/${p[0]}`;
}

/* "YYYY-MM-DD" en hora Argentina, a partir de un ISO o ms. */
function isoToDayKey(isoOrMs) {
  const ts = typeof isoOrMs === "number" ? isoOrMs : new Date(isoOrMs).getTime();
  const d = new Date(new Date(ts).toLocaleString("en-US", { timeZone: TZ_AR }));
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

/* Date para el FIN DE JORNADA Argentina (WORKDAY_END_HOUR_AR:00) del día
   correspondiente al ts dado. Argentina no usa DST, así que UTC-3 fijo. */
function endOfWorkdayArgFor(isoOrMs) {
  const dayKey = isoToDayKey(isoOrMs);
  const hh = String(WORKDAY_END_HOUR_AR).padStart(2,"0");
  return new Date(`${dayKey}T${hh}:00:00-03:00`);
}

/* Escapa HTML para evitar inyección al renderizar via innerHTML.
   El campo "texto" lo escribe el operario y podría contener < > & etc. */
function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* =========================================================
   ÚLTIMO LEGAJO (persistente entre cierres de app)
   Se guarda al confirmar "Continuar" y se precarga al abrir.
   Si otro operario quiere usar el mismo celular: solo borra y reescribe.
   ========================================================= */
function saveLastLegajo(legajo) {
  try { localStorage.setItem(LAST_LEGAJO_KEY, String(legajo || "")); } catch {}
}
function readLastLegajo() {
  try { return localStorage.getItem(LAST_LEGAJO_KEY) || ""; }
  catch { return ""; }
}

/* =========================================================
   HISTORIAL POR DÍA Y LEGAJO
   - Una key por (fecha, legajo). El "Resumen de hoy" es el array de hoy.
   - El modal 📅 muestra todos los días anteriores con datos.
   ========================================================= */
function histKey(fecha, legajo) {
  return `${HIST_V2_PREFIX}::${fecha}::${legajo}`;
}
function readDayHist(fecha, legajo) {
  try { return JSON.parse(localStorage.getItem(histKey(fecha, legajo)) || "[]"); }
  catch { return []; }
}
function writeDayHist(fecha, legajo, arr) {
  try { localStorage.setItem(histKey(fecha, legajo), JSON.stringify(arr)); } catch {}
}
function pushHistoryForLegajo(legajo, item) {
  pushHistoryForLegajoOnDay(legajo, getTodayKey(), item);
}
/* Saca del historial de HOY todos los items con cierta opción. Lo usa
   confirmarTerminarDia para limpiar FJ previas (de v1.10/v1.11 con id
   random, o de la misma versión cuando se cierra el día por segunda
   vez) antes de pushear la nueva. */
function removeHistoryItemsByOpcionForToday(legajo, opcion) {
  const fecha = getTodayKey();
  const arr   = readDayHist(fecha, legajo).filter(it => it.opcion !== opcion);
  writeDayHist(fecha, legajo, arr);
}
/* Idem pero escribiendo en la fecha que se pase explícitamente.
   Lo usa el auto-cierre, que escribe en la fecha en que se abrió el toggle. */
function pushHistoryForLegajoOnDay(legajo, fecha, item) {
  const arr = readDayHist(fecha, legajo);
  arr.unshift({ ...item, status: item.status || "queued" });
  if (arr.length > HIST_MAX_PER_DAY) arr.length = HIST_MAX_PER_DAY;
  writeDayHist(fecha, legajo, arr);
}

/* Marca un item del historial como sent / failed / queued.
   - sentAtIso: hora en que el cliente recibió la confirmación.
   - createdAtIso: timestamp REAL del INSERT en Supabase (server clock). */
function setHistoryItemStatus(legajo, fecha, itemId, status, sentAtIso, createdAtIso) {
  if (!legajo || !fecha || !itemId) return false;
  const arr = readDayHist(fecha, legajo);
  const i = arr.findIndex(it => it.id === itemId);
  if (i < 0) return false;
  arr[i].status = status;
  if (sentAtIso)    arr[i].sentAt    = sentAtIso;
  if (createdAtIso) arr[i].createdAt = createdAtIso;
  writeDayHist(fecha, legajo, arr);
  return true;
}

/* Pintar el badge según el status del item. */
function statusBadge(status) {
  if (status === "sent")   return ` <span class="status-badge status-sent">✓ enviado</span>`;
  if (status === "failed") return ` <span class="status-badge status-failed">⚠ falló</span>`;
  if (status === "queued") return ` <span class="status-badge status-queued">⏳ en cola</span>`;
  return "";
}
function getAllPrevDaysForLegajo(legajo) {
  const today = getTodayKey();
  const result = []; // [{ fecha, items }]
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(HIST_V2_PREFIX + "::")) continue;
    const parts = k.split("::");
    if (parts.length !== 3) continue;
    if (parts[2] !== legajo || parts[1] === today) continue;
    try {
      const items = JSON.parse(localStorage.getItem(k) || "[]");
      if (items.length) result.push({ fecha: parts[1], items });
    } catch {}
  }
  result.sort((a,b) => b.fecha.localeCompare(a.fecha));
  return result;
}

function renderLegajoHistory(legajo) {
  const container = document.getElementById("legajoHistoryContent");
  if (!legajo) {
    container.className = "history-empty";
    container.innerText = "Ingresá tu legajo para ver el resumen";
    return;
  }
  const hist = readDayHist(getTodayKey(), String(legajo));
  if (!hist.length) {
    container.className = "history-empty";
    container.innerText = "No hay reportes hoy para este legajo en este dispositivo.";
    return;
  }
  // Orden defensivo: más reciente arriba, más viejo abajo.
  hist.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  container.className = "history-list";
  container.innerHTML = hist.map(h => {
    // "Llegó al server" usa createdAt (si Supabase lo devolvió) o sentAt
    // (la hora en que el cliente recibió la confirmación 201, que para
    // efectos prácticos es cuando llegó a Supabase).
    const arrived = h.createdAt || h.sentAt;
    // El "Dato" del FJ es el JSON con conteos; técnico, confunde al
    // operario. Para FJ ocultamos esa línea pero la entrada se muestra
    // igual (con su badge de estado, error incluido).
    const showDato = h.opcion !== "FJ" && h.texto;
    return `
      <div class="history-item">
        <div class="line1">${escapeHtml(h.opcion)} — ${escapeHtml(h.descripcion)}${statusBadge(h.status)}</div>
        <div class="line2">
          ${showDato ? `Dato: <b>${escapeHtml(h.texto)}</b><br>` : ""}
          ${h.ts ? `Fecha: ${escapeHtml(formatDateTime(h.ts))}` : ""}
          ${arrived ? `<br>Llegó al server: ${escapeHtml(formatDateTime(arrived))}` : ""}
        </div>
      </div>
    `;
  }).join("");
}

/* =========================================================
   LIMPIEZA AL CAMBIAR DE DÍA
   1) Retiene los últimos N días PRODUCTIVOS (los que tienen datos),
      no se cuentan días sin trabajo.
   2) Borra del estado los toggles que NO sobreviven al día siguiente:
      todos menos "CR" y "MG". Picking y armado quedan intactos.
   Nunca toca lo que ya se mandó a Supabase.
   ========================================================= */
function cleanupIfDayChanged() {
  const today = getTodayKey();
  const last  = localStorage.getItem(DAY_GUARD_KEY);
  if (last === today) return;

  // (1) Retención de N días productivos
  const dates = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(HIST_V2_PREFIX + "::")) continue;
    const parts = k.split("::");
    if (parts.length === 3) dates.add(parts[1]);
  }
  const keep = new Set(
    Array.from(dates).sort((a,b) => b.localeCompare(a)).slice(0, MAX_PROD_DAYS)
  );
  const toDelete = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(HIST_V2_PREFIX + "::")) continue;
    const parts = k.split("::");
    if (parts.length === 3 && !keep.has(parts[1])) toDelete.push(k);
  }
  toDelete.forEach(k => localStorage.removeItem(k));

  // (2) Auto-cierre + limpieza de toggles que NO sobreviven al día siguiente.
  //     Antes de borrar el flag de localStorage, si el toggle está en
  //     AUTO_CLOSE_CODES y tiene ts_inicio guardado, encolamos un cierre
  //     automático con ts_cliente = fin de jornada del día en que se abrió.
  const map = readStateMap();
  for (const leg of Object.keys(map)) {
    const st = map[leg];
    if (!st || !st.toggles) continue;
    for (const code of Object.keys(st.toggles)) {
      if (SURVIVING_TOGGLES.includes(code)) continue;
      const cur = st.toggles[code];
      const tsInicioIso = (typeof cur === "string") ? cur : null;
      if (tsInicioIso && AUTO_CLOSE_CODES.includes(code)) {
        try { enqueueAutoClose(leg, code, tsInicioIso); } catch {}
      }
      delete st.toggles[code];
    }
  }
  writeStateMap(map);

  localStorage.setItem(DAY_GUARD_KEY, today);
}

/* =========================================================
   MODAL "Historial de días anteriores"
   ========================================================= */
function openHistoryModal() {
  const legajoStr = String(legajoInput.value || "").trim();
  if (!legajoStr) { alert("Ingresá tu legajo primero"); return; }
  const previas = getAllPrevDaysForLegajo(legajoStr);
  const content = document.getElementById("histModalContent");
  if (!previas.length) {
    content.innerHTML = `<div class="history-empty">No hay reportes de días anteriores guardados en este dispositivo para el legajo ${escapeHtml(legajoStr)}.</div>`;
  } else {
    // Orden defensivo dentro de cada día: más reciente arriba.
    previas.forEach(d => d.items.sort((a, b) => (b.ts || 0) - (a.ts || 0)));
    content.innerHTML = previas.map(d => `
      <div class="hist-day-block">
        <div class="hist-day-title">${escapeHtml(formatDayLong(d.fecha))} (${d.items.length})</div>
        ${d.items.map(it => {
          const arrived = it.createdAt || it.sentAt;
          // FJ: ocultar el "Dato" (JSON técnico), mostrar la entrada igual.
          const showDato = it.opcion !== "FJ" && it.texto;
          return `
            <div class="hist-day-item">
              <b>${escapeHtml(it.opcion)}</b> — ${escapeHtml(it.descripcion)}${statusBadge(it.status)}
              ${showDato ? ` — <i>${escapeHtml(it.texto)}</i>` : ""}
              ${it.ts ? `<br><span style="color:#666;font-size:12px;">${escapeHtml(formatDateTime(it.ts))}</span>` : ""}
              ${arrived ? `<br><span style="color:#666;font-size:12px;">Llegó al server: ${escapeHtml(formatDateTime(arrived))}</span>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    `).join("");
  }
  document.getElementById("histModal").classList.add("show");
}
function closeHistoryModal() {
  document.getElementById("histModal").classList.remove("show");
}

/* =========================================================
   "TERMINAR DÍA" — modal de confirmación + ejecución
   ========================================================= */

/* Cuenta los reportes del día por opción para este legajo. */
function getTodaySummaryForLegajo(legajo) {
  // El FJ es un marcador interno; no lo mostramos en el resumen para no
  // confundir al operario.
  const hist = readDayHist(getTodayKey(), String(legajo))
    .filter(it => it.opcion !== "FJ");
  const counts = {};
  for (const it of hist) {
    counts[it.opcion] = (counts[it.opcion] || 0) + 1;
  }
  return { total: hist.length, counts };
}

/* Devuelve qué pendientes tiene el legajo, separados en 3 grupos:
   - sobreviven        : continúan al día siguiente (picking/armado/CR/MG)
   - seCierranAuto     : se cierran ahora con texto="" (AT/PB/Limp/PC/CT/Perm)
   - seCierranConInput : se cierran ahora pero piden cantidad (CC/RT/RI/EI) */
function getPendingsForLegajo(legajo) {
  const st = getLegajoState(legajo);
  const sobreviven        = [];
  const seCierranAuto     = [];
  const seCierranConInput = [];
  if (st.picking && st.picking.active) {
    sobreviven.push({ tipo: "Picking", desc: "Picking en curso", valor: st.picking.value || "" });
  }
  if (st.armado && st.armado.active) {
    sobreviven.push({ tipo: "Armado", desc: "Armado en curso", valor: st.armado.value || "" });
  }
  if (st.toggles) {
    for (const code of Object.keys(st.toggles)) {
      const item = { tipo: code, desc: desc[code] || "", valor: "" };
      if (SURVIVING_TOGGLES.includes(code))             sobreviven.push(item);
      else if (CLOSE_NEEDS_INPUT_CODES.includes(code))  seCierranConInput.push(item);
      else                                              seCierranAuto.push(item);
    }
  }
  // Mantengo seCierran como unión para compatibilidad con código viejo.
  return { sobreviven, seCierranAuto, seCierranConInput,
           seCierran: [...seCierranAuto, ...seCierranConInput] };
}

function terminarDia() {
  const legajoStr = String(legajoInput.value || "");
  if (!legajoStr) { alert("Falta el número de legajo"); return; }

  const summary  = getTodaySummaryForLegajo(legajoStr);
  const pendings = getPendingsForLegajo(legajoStr);

  const opcionesOrden = Object.keys(summary.counts).sort();
  const summaryHtml = opcionesOrden.length
    ? `<ul style="margin:6px 0 0 0; padding-left:20px;">
         ${opcionesOrden.map(op =>
           `<li><b>${escapeHtml(op)}</b> — ${escapeHtml(desc[op] || "")}: ${summary.counts[op]}</li>`).join("")}
       </ul>`
    : `<div class="history-empty">Sin reportes hoy.</div>`;

  const sobrevivenHtml = pendings.sobreviven.length

  // Detectar si ya hubo un FJ hoy: bandera para mostrar advertencia.

         <b style="color:#854d0e;">⚠ Ya cerraste el día hoy${
           prevFJ.ts ? ` a las ${escapeHtml(formatDateTime(prevFJ.ts).split(" ")[1] || "")}` : ""
         }.</b><br>

  const html = `

/* Bulk "replay" del día — UNA llamada con array de filas y Prefer:
   resolution=ignore-duplicates. Recupera lo que se haya perdido, sin
   generar duplicados de lo que ya estaba.
   Filtra items sin id (legacy) que no podríamos dedup-ear. */
async function bulkSendDayReplay(legajoStr, historySnapshot) {
  const bulkPayload = (historySnapshot || [])
    .filter(item => item && item.id)
    .map(item => ({
      client_id:   item.id,
      legajo:      legajoStr,
      opcion:      item.opcion,
      descripcion: item.descripcion || (desc[item.opcion] || ""),
      texto:       item.texto || "",
      ts_cliente:  new Date(item.ts || Date.now()).toISOString(),
      ts_inicio:   item.ts_inicio_iso || null
    }));
  if (!bulkPayload.length) return;
  try {
    // Igual que en el upsert del FJ: PostgREST necesita ?on_conflict=client_id
    // para saber qué constraint usar; sin esto el ignore-duplicates no se
    // aplica y los conflictos tiran 409 abortando el batch.
    await fetch(SUPABASE_TABLE_ENDPOINT + "?on_conflict=client_id", {
      method: "POST",
      headers: {
        "apikey":        SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type":  "application/json",
        "Prefer":        "resolution=ignore-duplicates,return=minimal"
      },
      body: JSON.stringify(bulkPayload),
      keepalive: true
    });
  } catch (e) { /* best effort — si falla, los reportes individuales que
                   no se hayan enviado siguen reintentándose por su cuenta */ }
}

async function confirmarTerminarDia() {
  const legajoStr = String(legajoInput.value || "");
  if (!legajoStr) { closeTerminarDia(); return; }

  // Capturar pendientes ANTES de tocar el estado, así el resumen y la
  // limpieza son consistentes.
  const summary = getTodaySummaryForLegajo(legajoStr);
  const st = getLegajoState(legajoStr);

  // Validación de cantidades para los toggles CC/RT/RI/EI: si alguno
  // está abierto, el operario tiene que completar el input del modal
  // antes de confirmar. Sin completar => alerta y no cierra nada.
  const closeInputs = {};   // code -> cantidad escrita
  const pendNow = getPendingsForLegajo(legajoStr);
  for (const p of pendNow.seCierranConInput) {
    const el = document.getElementById("td_input_" + p.tipo);
    const v  = (el && el.value || "").trim();
    if (!v) {
      alert(`Falta completar la cantidad para ${p.tipo} (${p.desc}). Tenés que ponerla antes de terminar el día.`);
      if (el) { el.focus(); el.style.borderColor = "#dc2626"; }
      return;
    }
    closeInputs[p.tipo] = v;
  }

  const nowMs  = Date.now();
  const nowIso = new Date(nowMs).toISOString();

  // 0) RE-ENVIAR todos los reportes del día como red de seguridad — UNA SOLA
  //    llamada bulk con array (PostgREST acepta) y Prefer: resolution=
  //    ignore-duplicates: el server inserta los que faltan y descarta los
  //    duplicados por UNIQUE(client_id) sin tirar error.
  //    - Si ya estaba (envío original llegó OK): se descarta. Sin duplicado.
  //    - Si se había perdido: se inserta ahora, recuperado.
  //    - Si llega después un mensaje original que estaba en cola con el mismo
  //      client_id: el envío individual también es dedup-eado (UNIQUE).
  //    Snapshot tomado ANTES de los auto-cierres + FJ para no duplicar esos
  //    items recién creados — esos van por la cola normal (1-3 items).
  //    FJ previos de hoy (raro: solo si tocaron Terminar Día dos veces) se
  //    excluyen para no clonarlos como otra FJ con el mismo id.
  const todayHistSnapshot = readDayHist(getTodayKey(), legajoStr)
    .filter(it => it.opcion !== "FJ");
  bulkSendDayReplay(legajoStr, todayHistSnapshot);   // best-effort, no await

  // 1) Auto-cerrar TODOS los toggles no-sobrevivientes con ts_cliente = ahora.
  //    NO usamos enqueueAutoClose (que pone ts_cliente=17:00) porque acá el
  //    operario está cerrando manualmente, en este momento.
  if (st.toggles) {
    for (const code of Object.keys(st.toggles)) {
      if (SURVIVING_TOGGLES.includes(code)) continue;
      const cur = st.toggles[code];
      const tsInicioIso = (typeof cur === "string") ? cur : null;
      // Para CC/RT/RI/EI el texto del cierre viene del input del modal
      // (ya validado más arriba). Para AT/PB/Limp/PC/CT/Perm el texto
      // queda vacío como antes.
      const textoCierre = CLOSE_NEEDS_INPUT_CODES.includes(code)
        ? (closeInputs[code] || "")
        : "";
      const closeId = nowMs.toString(36) + "_fjclose_" + code + "_" + Math.random().toString(36).slice(2, 6);
      const closePayload = {
        legajo: legajoStr,
        opcion: code,
        descripcion: desc[code] || "",
        texto: textoCierre,
        ts: nowMs,
        id: closeId,
        ts_inicio_iso: tsInicioIso
      };
      pushHistoryForLegajo(legajoStr, {
        ts: nowMs, opcion: code, descripcion: closePayload.descripcion,
        texto: textoCierre, id: closeId, status: "queued",
        ts_inicio_iso: tsInicioIso
      });
      enqueueReport(closePayload);
      delete st.toggles[code];
    }
    setLegajoState(legajoStr, st);
  }

  // 2) Reporte FJ "Fin de Jornada" con resumen del día como JSON en texto.
  //    client_id DETERMINÍSTICO por (legajo, día) -> si tocan Terminar Día
  //    dos veces el mismo día, el server hace UPDATE (merge-duplicates)
  //    en vez de insertar otra fila. Una sola FJ por día por legajo.
  const fjId    = "fj_" + legajoStr + "_" + getTodayKey();
  const fjTexto = JSON.stringify(summary.counts);
  const fjPayload = {
    legajo: legajoStr,
    opcion: "FJ",
    descripcion: "Fin de Jornada",
    texto: fjTexto,
    ts: nowMs,
    id: fjId,
    ts_inicio_iso: null
  };
  // Si ya había una FJ de hoy en el historial local (de este Terminar Día
  // o de uno previo con id random pre-v1.12), la sacamos antes de pushear
  // la nueva, así queda una sola entrada de FJ en el historial local.
  removeHistoryItemsByOpcionForToday(legajoStr, "FJ");
  pushHistoryForLegajo(legajoStr, {
    ts: nowMs, opcion: "FJ", descripcion: "Fin de Jornada",
    texto: fjTexto, id: fjId, status: "queued"
  });
  enqueueReport(fjPayload);

  // 3) Forzar flush ahora — antes de que el operario cierre el celular.
  flushQueue();

  // 4) Cerrar modal + volver a pantalla de legajo. NO se borra el legajo
  //    guardado: si mañana vuelve el mismo operario, ya lo tiene precargado.
  closeTerminarDia();
  resetSelection();
  optionsScreen.classList.add("hidden");
  legajoScreen.classList.remove("hidden");
  document.getElementById("btnHistDias")?.classList.remove("hidden");
  renderLegajoHistory(legajoInput.value);
  updateCoreButtonsState();
  renderPendingSuggestion();
  updatePendingIndicator();
}

/* =========================================================
   ESTADO por legajo:
   - picking: { active, value }  (EP->TP)
   - armado:  { active, value }  (AP->TAP)
   - toggles: { CR:true, AT:true, ... } (1ra vez inicia, 2da termina)
   ========================================================= */
const CORE_CODES   = ["EP","TP","AP","TAP"];
const TOGGLE_CODES = ["CR","CC","RT","MG","RI","EI","AT","PB","Limp","PC","Perm","CT"];

/* Códigos de TIEMPO MUERTO. Cuando uno está abierto, se bloquea todo lo
   demás hasta cerrarlo (tocando el mismo botón otra vez). El resto de
   los toggles (CR, MG, CC, RT, RI, EI, Perm) NO bloquean. */
const DEAD_TIME_CODES = ["AT","PB","Limp","PC","CT"];

/* Botones SIEMPRE tocables — no se les aplica NINGUNA regla de bloqueo
   impuesta por otras tareas. Caso de uso: el operario está en limpieza
   y necesita ir al baño / a comer; al volver, sigue limpieza. */
const ALWAYS_ALLOWED_CODES = ["PB","PC"];

function readStateMap(){
  try { return JSON.parse(localStorage.getItem(STATE_KEY)) || {}; }
  catch { return {}; }
}
function writeStateMap(map){
  localStorage.setItem(STATE_KEY, JSON.stringify(map));
}
function getLegajoState(legajo){
  const map = readStateMap();
  const key = String(legajo || "");
  if (!map[key]) {
    map[key] = { picking: {active:false,value:""}, armado:{active:false,value:""}, toggles:{} };
    writeStateMap(map);
  } else {
    map[key].picking = map[key].picking || {active:false,value:""};
    map[key].armado  = map[key].armado  || {active:false,value:""};
    map[key].toggles = map[key].toggles || {};
  }
  return map[key];
}
function setLegajoState(legajo, newState){
  const map = readStateMap();
  map[String(legajo || "")] = newState;
  writeStateMap(map);
}
function isToggleEnding(legajo, code){
  if (!TOGGLE_CODES.includes(code)) return false;
  const st = getLegajoState(legajo);
  return !!st.toggles[code];
}
function toggleStartOrEnd(legajo, code){
  const st = getLegajoState(legajo);
  const wasActive = !!st.toggles[code];
  if (wasActive) {
    delete st.toggles[code];
  } else {
    // Guarda el ts de apertura como ISO string; truthiness sigue funcionando.
    st.toggles[code] = new Date().toISOString();
  }
  setLegajoState(legajo, st);
  return { started: !wasActive, ended: wasActive };
}

/* =========================================================
   BLOQUEO: si hay cualquier toggle activo (no-core), NO se puede seleccionar EP/TP/AP/TAP
   + deshabilitado visual
   ========================================================= */
/* Cualquier toggle abierto (regla VIEJA: bloquea EP/TP/AP/TAP). */
function getAnyToggleActive(legajo){
  const st = getLegajoState(legajo);
  if (!st.toggles) return null;
  const keys = Object.keys(st.toggles);
  return keys[0] || null;
}

/* Tiempo muerto abierto (regla NUEVA: bloquea TODO menos el mismo botón).
   Solo AT, PB, Limp, PC y CT. */
function getActiveDeadTime(legajo){
  const st = getLegajoState(legajo);
  if (!st.toggles) return null;
  for (const code of DEAD_TIME_CODES) {
    if (st.toggles[code]) return code;
  }
  return null;
}

/* Aplica las dos reglas:
   - Si hay tiempo muerto activo: TODOS los botones quedan deshabilitados
     menos el mismo botón del tiempo muerto (para poder cerrarlo).
   - Si NO hay tiempo muerto pero sí hay algún toggle activo (CR, MG, etc):
     solo se deshabilitan EP/TP/AP/TAP, los demás botones quedan tocables.
   - PB y PC nunca se deshabilitan (siempre tocables).
   - Además, marca con borde rojo (.pending) los botones que correspondan
     a tareas abiertas sin cerrar. */
function updateCoreButtonsState(){
  const legajoStr = String(legajoInput.value || "");
  const deadTime  = getActiveDeadTime(legajoStr);
  const anyToggle = getAnyToggleActive(legajoStr);
  const st        = legajoStr ? getLegajoState(legajoStr) : null;
  const pickingActive = !!(st && st.picking && st.picking.active);
  const armadoActive  = !!(st && st.armado  && st.armado.active);

  document.querySelectorAll(".box").forEach(b=>{
    const code = b.querySelector(".box-title")?.innerText?.trim();
    if (!code) return;

    // ===== DISABLED =====
    let disabled = false;
    if (ALWAYS_ALLOWED_CODES.includes(code)) {
      disabled = false;                                           // PB/PC siempre tocables
    } else if (deadTime && code !== deadTime) {
      disabled = true;                                            // regla nueva
    } else if (CORE_CODES.includes(code) && anyToggle) {
      disabled = true;                                            // regla vieja
    }
    b.classList.toggle("disabled", disabled);

    // ===== PENDING (borde rojo) =====
    let pending = false;
    if ((code === "EP" || code === "TP") && pickingActive) pending = true;
    else if ((code === "AP" || code === "TAP") && armadoActive) pending = true;
    else if (TOGGLE_CODES.includes(code) && st && st.toggles && st.toggles[code]) pending = true;
    b.classList.toggle("pending", pending);
  });
}

/* =========================================================
   SUGERENCIA (SOLO Picking/Armado)
   ========================================================= */
function ensurePendingSuggestionContainer(){
  let box = document.getElementById("pendingSuggestion");
  if (!box) {
    box = document.createElement("div");
    box.id = "pendingSuggestion";
    const row3El = document.getElementById("row3");
    if (row3El && row3El.parentNode) row3El.parentNode.insertBefore(box, row3El.nextSibling);
  }
  return box;
}

function renderPendingSuggestion(){
  const legajo = String(legajoInput.value || "");
  const box = ensurePendingSuggestionContainer();
  box.innerHTML = "";
  if(!legajo) return;

  // Si hay CUALQUIER toggle activo, EP/TP/AP/TAP están bloqueados;
  // ocultar la sugerencia (no se podría tocar igual).
  if (getAnyToggleActive(legajo)) return;

  const st = getLegajoState(legajo);

  // PICKING
  if (st.picking && st.picking.active && st.picking.value) {
    const btn = document.createElement("button");
    btn.className = "primary-btn";
    btn.innerText = `Tenés un Picking pendiente (${st.picking.value}) — Presioná para terminar`;
    btn.onclick = ()=>{
      selectOption("TP");
      textInput.value = st.picking.value || "";
    };
    box.appendChild(btn);
    return;
  }

  // ARMADO
  if (st.armado && st.armado.active && st.armado.value) {
    const btn = document.createElement("button");
    btn.className = "primary-btn";
    btn.innerText = `Tenés un Armado pendiente (${st.armado.value}) — Presioná para terminar`;
    btn.onclick = ()=>{
      selectOption("TAP");
      textInput.value = st.armado.value || "";
    };
    box.appendChild(btn);
    return;
  }
}
