/* Lista de tandas planificadas (Op=SI) del PPP — fetched cuando el operario
   abre EP/TP/AP/TAP/CC para que pueda tocar una en vez de tipearla.
   Cache 30 s, se rinde solo si la fetch falla. */
let _pppOperatorCache    = null;
let _pppOperatorTs       = 0;
let _tandasListExpanded  = false;   // se resetea cada vez que se oculta la lista
let _tandasListMode      = "all";   // "all" | "pickingDone" | "notStarted"
let _activityStatusCache = null;    // { pickingStarted, pickingDone, armadoStarted, armadoDone }
let _activityStatusTs    = 0;
const PPP_OPERATOR_TTL_MS     = 30000;
const ACTIVITY_STATUS_TTL_MS  = 10000;
const TANDAS_LIST_VISIBLE_DAYS = 3;

/* Devuelve TODAS las tandas reales del PPP (con fecha de entrega válida,
   excluyendo "S/Tanda"). Cada item lleva su flag opIsSi para que cada modo
   decida si lo necesita o no:
     EP / TP / CC → exigen opIsSi=true (solo planificadas)
     AP / TAP     → no exigen Op=SI (incluyen tandas con actividad sin SI,
                    como C04G que está siendo trabajada pero le falta el SI) */
async function getPppTandasForOperator() {
  const now = Date.now();
  if (_pppOperatorCache && (now - _pppOperatorTs) < PPP_OPERATOR_TTL_MS) {
    return _pppOperatorCache;
  }
  try {
    const sheetMap = await fetchMonitorSheet();
    const items = [];
    for (const v of sheetMap.values()) {
      if (!v.tanda || v.tanda === "S/Tanda") continue;
      if (!v.fechaEntregaRaw) continue;
      items.push({
        tanda: v.tanda,
        opIsSi: !!v.opIsSi,
        fechaRaw: v.fechaEntregaRaw,
        fechaDisplay: v.fechaEntrega
      });
    }
    _pppOperatorCache = items;
    _pppOperatorTs = Date.now();
    return items;
  } catch (e) {
    console.warn("[operator] PPP fetch fallido:", e.message);
    return _pppOperatorCache || [];
  }
}

/* Trae el estado de Picking y Armado de los últimos 7 días. Devuelve sets:
     pickingStarted:    tandas con cualquier EP o TP (normalizado: trim+upper)
     pickingDone:       último EP/TP es TP (normalizado, ✅ en columna Picking)
     pickingDoneStrict: idem pickingDone pero texto EXACTO (sin trim). Usado
                        por TP para no excluir tandas con TP mal tipeado.
     armadoStarted:     tandas con cualquier AP o TAP (normalizado)
     armadoDone:        último AP/TAP es TAP (normalizado, ✅ Pedido Separado)
     armadoDoneStrict:  idem armadoDone pero texto EXACTO (sin trim). Usado
                        por AP para no excluir tandas con TAP mal tipeado
                        (ej: "C02D " con espacio no excluye al PPP "C02D").
   Cache 10s. */
async function getActivityStatus() {
  const now = Date.now();
  if (_activityStatusCache && (now - _activityStatusTs) < ACTIVITY_STATUS_TTL_MS) {
    return _activityStatusCache;
  }
  const empty = {
    pickingStarted:    new Set(),
    pickingDone:       new Set(),
    pickingDoneStrict: new Set(),
    armadoStarted:     new Set(),
    armadoDone:        new Set(),
    armadoDoneStrict:  new Set()
  };
  try {
    const since = new Date(Date.now() - 7*24*60*60*1000).toISOString();
    const url = SUPABASE_TABLE_ENDPOINT +
      "?opcion=in.(EP,TP,AP,TAP)" +
      "&ts_cliente=gte." + encodeURIComponent(since) +
      "&order=ts_cliente.asc" +
      "&limit=10000" +
      "&select=opcion,texto,ts_cliente";
    const r = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!r.ok) throw new Error("Supabase HTTP " + r.status);
    const data = await r.json();
    const lastPick       = new Map();   // normalizado
    const lastPickStrict = new Map();   // texto exacto
    const lastArm        = new Map();   // normalizado
    const lastArmStrict  = new Map();   // texto exacto
    const status = {
      pickingStarted:    new Set(),
      pickingDone:       new Set(),
      pickingDoneStrict: new Set(),
      armadoStarted:     new Set(),
      armadoDone:        new Set(),
      armadoDoneStrict:  new Set()
    };
    for (const ev of data) {
      const tRaw  = ev.texto || "";
      const tNorm = tRaw.trim().toUpperCase();
      if (!tNorm) continue;
      const ts = ev.ts_cliente;
      if (ev.opcion === "EP" || ev.opcion === "TP") {
        status.pickingStarted.add(tNorm);
        const cur = lastPick.get(tNorm);
        if (!cur || ts > cur.ts) lastPick.set(tNorm, { opcion: ev.opcion, ts });
        const curS = lastPickStrict.get(tRaw);
        if (!curS || ts > curS.ts) lastPickStrict.set(tRaw, { opcion: ev.opcion, ts });
      } else if (ev.opcion === "AP" || ev.opcion === "TAP") {
        status.armadoStarted.add(tNorm);
        const cur = lastArm.get(tNorm);
        if (!cur || ts > cur.ts) lastArm.set(tNorm, { opcion: ev.opcion, ts });
        const curS = lastArmStrict.get(tRaw);
        if (!curS || ts > curS.ts) lastArmStrict.set(tRaw, { opcion: ev.opcion, ts });
      }
    }
    for (const [t, ev] of lastPick)       if (ev.opcion === "TP")  status.pickingDone.add(t);
    for (const [t, ev] of lastPickStrict) if (ev.opcion === "TP")  status.pickingDoneStrict.add(t);
    for (const [t, ev] of lastArm)        if (ev.opcion === "TAP") status.armadoDone.add(t);
    for (const [t, ev] of lastArmStrict)  if (ev.opcion === "TAP") status.armadoDoneStrict.add(t);
    _activityStatusCache = status;
    _activityStatusTs    = Date.now();
    return status;
  } catch (e) {
    console.warn("[operator] activity status fetch fallido:", e.message);
    return _activityStatusCache || empty;
  }
}

/* filterMode (opcional, persistido en _tandasListMode):
     "all"          → solo Op=SI (CC)
     "notStarted"   → Op=SI Y sin EP/TP todavía (EP)
     "pickingCurso" → EP empezado pero sin TP — incluye no-SI — (TP: ⏰ en
                      columna Picking del monitor)
     "pickingDone"  → TP confirmado Y sin TAP todavía — incluye no-SI — (AP)
     "armadoCurso"  → AP empezado pero sin TAP — incluye no-SI — (TAP) */
async function populateTandasList(filterMode) {
  if (filterMode != null) _tandasListMode = filterMode;
  const container = document.getElementById("tandasList");
  if (!container) return;
  container.classList.remove("hidden");
  container.innerHTML = `<div class="tandas-list-label">Cargando lista…</div>`;
  const items = await getPppTandasForOperator();
  let filtered;
  if (_tandasListMode === "notStarted") {
    const s = await getActivityStatus();
    filtered = items.filter(it => it.opIsSi && !s.pickingStarted.has(it.tanda.toUpperCase()));
  } else if (_tandasListMode === "pickingCurso") {
    const s = await getActivityStatus();
    // pickingStarted: lenient (cualquier EP/TP entra como "empezado").
    // pickingDoneStrict: exacto, así un TP con espacio ("C02D ") no excluye
    // al PPP "C02D" — la tanda sigue apareciendo como en curso para cerrar.
    filtered = items.filter(it => {
      const k = it.tanda.toUpperCase();
      return s.pickingStarted.has(k) && !s.pickingDoneStrict.has(it.tanda);
    });
  } else if (_tandasListMode === "pickingDone") {
    const s = await getActivityStatus();
    // pickingDone: lenient (normalizado), así matchea aunque haya tipos.
    // armadoDoneStrict: exacto, para que un TAP con espacio extra ("C02D ")
    // no excluya la tanda PPP "C02D" del filtro de AP.
    filtered = items.filter(it => {
      const k = it.tanda.toUpperCase();
      return s.pickingDone.has(k) && !s.armadoDoneStrict.has(it.tanda);
    });
  } else if (_tandasListMode === "armadoCurso") {
    const s = await getActivityStatus();
    filtered = items.filter(it => {
      const k = it.tanda.toUpperCase();
      return s.armadoStarted.has(k) && !s.armadoDone.has(k);
    });
  } else {
    filtered = items.filter(it => it.opIsSi);
  }
  if (!filtered.length) {
    const msg = _tandasListMode === "pickingDone"
      ? "No hay tandas con Picking terminado disponibles para armado."
      : _tandasListMode === "pickingCurso"
        ? "No hay pickings en curso para terminar."
        : _tandasListMode === "notStarted"
          ? "Todas las tandas ya tienen Picking iniciado."
          : _tandasListMode === "armadoCurso"
            ? "No hay armados en curso para terminar."
            : "No se pudo cargar la lista — escribí el nro a mano.";
    container.innerHTML = `<div class="tandas-list-empty">${msg}</div>`;
    return;
  }
  // Agrupar por fecha de entrega
  const byDate = new Map();
  for (const it of filtered) {
    if (!byDate.has(it.fechaRaw)) byDate.set(it.fechaRaw, { fechaDisplay: it.fechaDisplay, codes: new Set() });
    byDate.get(it.fechaRaw).codes.add(it.tanda);
  }
  const grouped = [...byDate.entries()].sort().map(([raw, g]) => ({
    fechaRaw: raw,
    fechaDisplay: g.fechaDisplay,
    codes: [...g.codes].sort()
  }));
  // Mostrar solo los primeros N días; botón "Ver más" expande el resto.
  const visible = _tandasListExpanded
    ? grouped
    : grouped.slice(0, TANDAS_LIST_VISIBLE_DAYS);
  const hidden = grouped.length - visible.length;
  const groupsHtml = visible.map(g => `
    <div class="tandas-day-group">
      <div class="tandas-day-header">${escapeHtml(g.fechaDisplay)}</div>
      <div class="tandas-chips">
        ${g.codes.map(c => `<button class="tanda-chip" type="button" data-code="${escapeHtml(c)}" onclick="textInput.value=this.dataset.code;textInput.focus()">${escapeHtml(c)}</button>`).join("")}
      </div>
    </div>
  `).join("");
  const moreBtnHtml = hidden > 0
    ? `<button class="tandas-more-btn" type="button" onclick="expandTandasList()">Ver más (+${hidden} ${hidden === 1 ? "día" : "días"})</button>`
    : "";
  container.innerHTML = `<div class="tandas-day-grid">${groupsHtml}</div>${moreBtnHtml}`;
}

function expandTandasList() {
  _tandasListExpanded = true;
  populateTandasList();
}

function hideTandasList() {
  const container = document.getElementById("tandasList");
  if (container) container.classList.add("hidden");
  _tandasListExpanded = false;   // próxima apertura empieza colapsado
  _tandasListMode    = "all";    // y sin filtro hasta que selectOption pase otro
}

function selectOption(code) {
  const legajoStr = String(legajoInput.value || "");

  // Excepción: PB y PC siempre se pueden tocar — no aplican reglas de bloqueo.
  if (!ALWAYS_ALLOWED_CODES.includes(code)) {
    // Regla 1 (NUEVA): si hay TIEMPO MUERTO abierto (AT/PB/Limp/PC/CT),
    // solo se puede tocar ese mismo código para cerrarlo. Todo lo demás bloqueado.
    const deadTime = getActiveDeadTime(legajoStr);
    if (deadTime && code !== deadTime) {
      alert(`Tenés un tiempo muerto abierto: ${deadTime} — ${desc[deadTime]}\nTocá ${deadTime} de nuevo para terminarlo antes de hacer otra cosa.`);
      updateCoreButtonsState();
      return;
    }

    // Regla 2 (VIEJA): si hay CUALQUIER toggle abierto (CR, MG, RT, etc.),
    // EP/TP/AP/TAP siguen bloqueados como hasta ahora.
    if (CORE_CODES.includes(code)) {
      const anyToggle = getAnyToggleActive(legajoStr);
      if (anyToggle) {
        alert(`Tenés una acción pendiente: ${anyToggle} — ${desc[anyToggle]}\nTerminála antes de usar EP/TP/AP/TAP.`);
        updateCoreButtonsState();
        return;
      }
    }
  }

  selected = code;
  selectedArea.classList.remove("hidden");

  selectedBox.innerText = code;
  selectedDesc.innerText = desc[code];

  // reset input
  inputArea.classList.add("hidden");
  textInput.value = "";
  textInput.placeholder = "";
  hideTandasList();

  // ======= REGLA: toggles muestran input SOLO al TERMINAR (y algunos nunca)
  let showsTandaList = false;
  if (TOGGLE_CODES.includes(code)) {
  const ending = isToggleEnding(legajoStr, code);

  // Estos NUNCA piden input
  const NEVER_INPUT = ["AT","PB","Limp","PC","Perm","MG","CR","CT"];  // 👈 CR agregado y CT

  if (ending && !NEVER_INPUT.includes(code)) {
    inputArea.classList.remove("hidden");

    if (code === "CC") {
      inputLabel.innerText = "Ingresar Nro Picking";
      textInput.placeholder = "Ej: A12";
      showsTandaList = true;
    } else {
      inputLabel.innerText = "Indicar Cantidad";
      textInput.placeholder = "Ej: 100";
    }
  }
}

  // ======= Picking / Armado siguen igual (siempre piden nro)
  else if (["EP","TP","AP","TAP"].includes(code)) {
    inputArea.classList.remove("hidden");
    inputLabel.innerText = "Ingresar Nro Picking";
    textInput.placeholder = "Ej: A12B";
    showsTandaList = true;
    // Pre-fill: si el operario está cerrando algo (TP/TAP) y tiene una abierta
    // en su estado local, la ponemos ya en el input para que solo confirme.
    const st = getLegajoState(legajoStr);
    if (code === "TP" && st.picking && st.picking.active && st.picking.value) {
      textInput.value = st.picking.value;
    } else if (code === "TAP" && st.armado && st.armado.active && st.armado.value) {
      textInput.value = st.armado.value;
    }
  }

  // Mostrar lista de tandas planificadas cuando el campo es nro de picking.
  // EP  → sin empezar (sin EP/TP previo)
  // TP  → pickings en curso (= ⏰ en columna Picking del monitor)
  // AP  → con TP confirmado y sin TAP
  // TAP → armados en curso (= ⏰ en Pedido Separado)
  // CC  → todas (Op=SI)
  if (showsTandaList) {
    const mode = code === "EP"  ? "notStarted"
               : code === "TP"  ? "pickingCurso"
               : code === "AP"  ? "pickingDone"
               : code === "TAP" ? "armadoCurso"
               : "all";
    populateTandasList(mode);
  }

  // Toggle entre los 2 botones Enviar:
  //   - input visible → muestra el INLINE (al lado del label) y oculta el de abajo
  //   - input oculto  → muestra el de abajo y oculta el inline
  const showingInput = !inputArea.classList.contains("hidden");
  document.getElementById("sendBtn").classList.toggle("hidden", showingInput);

  // Avisos:
  // - AT/PB/Limp/PC/CT ya bloquean toda la pantalla cuando están abiertos,
  //   así que no hace falta el "acordate de poner lo mismo al terminar":
  //   el operario solo puede tocar ese botón para cerrarlo.
  // - Perm sí lo mantenemos: avisa al operario que si vuelve el mismo
  //   día tiene que cerrar el permiso.
  if (["Perm"].includes(code)) {
    aviso.classList.remove("hidden");
    aviso.innerText = "Acordate de poner lo mismo si regresas en el mismo dia";
  } else {
    aviso.classList.add("hidden");
  }

  updateCoreButtonsState();
}

function resetSelection() {
  selected = null;
  selectedArea.classList.add("hidden");
  hideTandasList();
}

/* =========================================================
   COLA DE ENVÍOS (offline-first)
   Resuelve: reportes que se perdían cuando la red estaba caída,
   porque el fetch anterior tenía .catch(()=>{}) y se mostraba
   "Reporte enviado correctamente" aunque no hubiera llegado.
   ========================================================= */
const QUEUE_KEY = "legajo_queue_virgilio_v1";

function readQueue() {
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }
  catch { return []; }
}
function writeQueue(arr) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(arr)); } catch {}
}

/* =========================================================
   IndexedDB — espejo de la cola, accesible al Service Worker.
   localStorage es solo accesible desde la página (no desde el SW),
   así que duplicamos cada item en IDB para que el SW pueda enviarlo
   en background aunque la app esté cerrada.
   ========================================================= */
const IDB_NAME    = "registro-prod-virgilio";
const IDB_VERSION = 1;
const IDB_STORE   = "queue";
let _idbDbPromise = null;
function idbOpen() {
  if (_idbDbPromise) return _idbDbPromise;
  if (!("indexedDB" in window)) {
    _idbDbPromise = Promise.reject(new Error("IDB no disponible"));
    return _idbDbPromise;
  }
  _idbDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
  return _idbDbPromise;
}
function idbPut(item) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    const r = tx.objectStore(IDB_STORE).put(item);
    r.onsuccess = () => res();
    r.onerror   = () => rej(r.error);
  }));
}
function idbDelete(id) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    const r = tx.objectStore(IDB_STORE).delete(id);
    r.onsuccess = () => res();
    r.onerror   = () => rej(r.error);
  }));
}
function idbGetAll() {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const r = tx.objectStore(IDB_STORE).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror   = () => rej(r.error);
  }));
}

/* Pide al SW que reintente la cola apenas pueda (Background Sync API).
   En navegadores sin soporte (Safari iOS), falla silencioso y dependemos
   del setInterval/online de la página. */
async function registerBackgroundSync() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    if (reg && "sync" in reg) {
      await reg.sync.register("flush-queue");
    }
  } catch { /* no soportado, sin drama */ }
}

function enqueueReport(payload) {
  // fecha = día (hora Arg) del ts del payload. Para un reporte normal
  // payload.ts es Date.now() así que cae en hoy. Para un auto-cierre del
  // día anterior, payload.ts es las 17:00 de ayer y la fecha va a ser ayer
  // — así el setHistoryItemStatus actualiza el ítem en el archivo correcto.
  const fechaHist = payload.ts ? isoToDayKey(payload.ts) : getTodayKey();
  const item = {
    id: payload.id,
    payload,
    attempts: 0,
    addedAt: Date.now(),
    legajo: String(payload.legajo || ""),
    fecha:  fechaHist
  };
  // Doble escritura: LS (rápido, para la página) e IDB (visible al SW).
  const arr = readQueue();
  arr.push(item);
  writeQueue(arr);
  idbPut(item).catch(() => {});
  updatePendingIndicator();
  registerBackgroundSync();   // pide al browser que despache aunque cerremos la app

  // Mirror a Fichadas_Historico — tabla consolidada de fichadas
  // (Entrada/Comida Inicia/Comida Termina/Salida) que combina los
  // operarios Virgilio con los importados del Google Sheet legacy.
  // Best-effort, fire-and-forget: si falla, el evento ya quedó en
  // Registros_Produccion_Virgilio (fuente de verdad para producción).
  mirrorOperatorEventToHistorico(payload).catch(() => {});
}

/* =====================================================================
   Mirror de eventos PC/FJ al Fichadas_Historico de Supabase.
   ---------------------------------------------------------------------
   Solo se mandan los eventos que representan una fichada de horario:
   - PC apertura (toggle 1ra vez)  → 'Comida Inicia'
   - PC cierre   (toggle 2da vez)  → 'Comida Termina'
   - FJ                            → 'Salida'
   - La Entrada la manda fichada.html directamente al hacer el QR.
   Resuelve legajo -> email vía Empleados (cacheado por sesion).
   ===================================================================== */
const _legajoEmailCache = new Map();   // legajo -> email|null (null = no tiene)
async function _resolveEmailForLegajo(legajo) {
  if (!legajo) return null;
  const key = String(legajo).trim();
  if (!key) return null;
  if (_legajoEmailCache.has(key)) return _legajoEmailCache.get(key);
  try {
    const url = SUPABASE_URL +
      "/rest/v1/Empleados?Legajo=eq." + encodeURIComponent(key) +
      "&select=email&limit=1";
    const r = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!r.ok) return null;       // no cacheamos error: probamos de nuevo despues
    const data = await r.json();
    const email = (Array.isArray(data) && data.length && data[0].email)
      ? String(data[0].email).trim()
      : null;
    _legajoEmailCache.set(key, email);
    return email;
  } catch { return null; }
}

function _mapOpcionToFichadaEvento(payload) {
  if (!payload || !payload.opcion) return null;
  if (payload.opcion === "FJ") return "Salida";
  if (payload.opcion === "PC") {
    // PC es toggle: 1ra vez sin ts_inicio_iso = apertura (Comida Inicia),
    // 2da vez con ts_inicio_iso = cierre (Comida Termina).
    return payload.ts_inicio_iso ? "Comida Termina" : "Comida Inicia";
  }
  return null;
}

async function mirrorOperatorEventToHistorico(payload) {
  const evento = _mapOpcionToFichadaEvento(payload);
  if (!evento) return;            // opcion fuera del scope (EP, TP, etc.)
  const email = await _resolveEmailForLegajo(payload.legajo);
  if (!email) return;             // sin email no podemos identificar al operario en la tabla
  const tsIso = payload.ts ? new Date(payload.ts).toISOString() : new Date().toISOString();
  const body = {
    ts_evento: tsIso,
    evento:    evento,
    email:     email,
    legajo:    String(payload.legajo)
  };
  try {
    const r = await fetch(SUPABASE_HISTORICO_ENDPOINT, {
      method: "POST",
      headers: {
        "apikey":        SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type":  "application/json",
        "Prefer":        "return=minimal,resolution=ignore-duplicates"
      },
      body: JSON.stringify(body)
    });
    if (!r.ok && r.status !== 409) {
      console.warn("[historico] HTTP", r.status, "para", evento, email);
    }
  } catch (e) {
    console.warn("[historico] fetch fallo:", e && e.message);
  }
}

/* Genera un cierre automático para un toggle que quedó abierto al cambiar
   de día. ts_cliente = fin de jornada (17:00 Arg) del día en que se abrió. */
function enqueueAutoClose(legajo, code, tsInicioIso) {
  const endTs   = endOfWorkdayArgFor(tsInicioIso);
  const startTs = new Date(tsInicioIso).getTime();
  // Defensa: si los timestamps son inválidos (localStorage corrupto), abortar.
  if (isNaN(endTs.getTime()) || isNaN(startTs)) return;
  // Si el fin de jornada calculado es <= el ts_inicio (caso raro: el operario
  // abrió un Perm después de las 17:00 y no volvió), no auto-cerramos —
  // queda como apertura suelta y Logística la trata como excepción.
  if (endTs.getTime() <= startTs) return;

  const nowMs = endTs.getTime();
  const id    = nowMs.toString(36) + "_auto_" + Math.random().toString(36).slice(2, 8);
  const descr = desc[code] || "";
  const payload = {
    legajo:        legajo,
    opcion:        code,
    descripcion:   descr,
    texto:         "",
    ts:            nowMs,
    id:            id,
    ts_inicio_iso: tsInicioIso
  };
  // El cierre auto va al historial del día en que se abrió, no al de hoy.
  pushHistoryForLegajoOnDay(legajo, isoToDayKey(nowMs), {
    ts: nowMs, opcion: code, descripcion: descr,
    texto: "", id: id, status: "queued",
    ts_inicio_iso: tsInicioIso
  });
  enqueueReport(payload);
}
function removeFromQueue(id) {
  writeQueue(readQueue().filter(it => it.id !== id));
  idbDelete(id).catch(() => {});
  updatePendingIndicator();
}

/* Intenta enviar UN payload a Supabase.
   Devuelve { ok, networkFail, status }:
     - ok=true            -> aceptado (201 ó 409 dedup)
     - ok=false, networkFail=true  -> sin respuesta (timeout, sin red, CORS)
     - ok=false, networkFail=false -> el server respondió con error (4xx/5xx) */
async function trySendOneReport(payload) {
  try {
    // Corte duro a los 12s para no quedarnos esperando si la red se cuelga.
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 12000);
    // FJ usa client_id determinístico (fj_<legajo>_<YYYY-MM-DD>) y merge-duplicates
    // para que un segundo Terminar Día del mismo día actualice (UPDATE) el FJ
    // anterior en vez de fallar con 409. Para todo lo demás, return=minimal normal.
    // IMPORTANTE: PostgREST necesita ?on_conflict=client_id en la URL para que
    // el UPSERT use el UNIQUE constraint correcto (sin esto, asume el PK
    // y el merge-duplicates no se aplica → 409).
    const isFJ   = (payload.opcion === "FJ");
    const url    = isFJ
      ? SUPABASE_TABLE_ENDPOINT + "?on_conflict=client_id"
      : SUPABASE_TABLE_ENDPOINT;
    const prefer = isFJ
      ? "resolution=merge-duplicates,return=minimal"
      : "return=minimal";
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "apikey":        SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type":  "application/json",
        "Prefer":        prefer
      },
      body: JSON.stringify({
        client_id:   payload.id,                              // UNIQUE en la tabla -> dedup
        legajo:      payload.legajo,
        opcion:      payload.opcion,
        descripcion: payload.descripcion,
        texto:       payload.texto,
        ts_cliente:  new Date(payload.ts).toISOString(),
        ts_inicio:   payload.ts_inicio_iso || null            // solo poblado en cierres
      }),
      keepalive: true,        // sobrevive a cambios de pantalla / cierres rápidos
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (!res) return { ok: false, networkFail: true };
    // 201 Created = ok. 409 Conflict = ya existía (reintento exitoso).
    if (res.ok || res.status === 409) return { ok: true, status: res.status };
    // Server respondió pero rechazó. No reintentar al toque.
    return { ok: false, networkFail: false, status: res.status };
  } catch (e) {
    // fetch tiró: timeout, offline, CORS, etc.
    return { ok: false, networkFail: true };
  }
}

/* =========================================================
   AUDITORÍA REMOTA: registra eventos de envío fallido en la tabla
   Auditoria_Produccion_Virgilio. Best-effort, fire-and-forget.
   Si la tabla no existe o no hay red, el log se descarta silencioso.
   ========================================================= */
const AUDIT_ENDPOINT =
  SUPABASE_URL + "/rest/v1/Auditoria_Produccion_Virgilio";

function logErrorToAudit(payload, attempts, r) {
  try {
    const body = {
      client_id:   payload.id || null,
      legajo:      payload.legajo || null,
      opcion:      payload.opcion || null,
      descripcion: payload.descripcion || null,
      texto:       payload.texto || null,
      ts_cliente:  payload.ts ? new Date(payload.ts).toISOString() : null,
      ts_inicio:   payload.ts_inicio_iso || null,
      intentos:    attempts || 1,
      motivo:      r.networkFail ? "network" : `server_${r.status || "?"}`,
      user_agent:  (typeof navigator !== "undefined" && navigator.userAgent) || null
    };
    fetch(AUDIT_ENDPOINT, {
      method: "POST",
      headers: {
        "apikey":        SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type":  "application/json",
        "Prefer":        "return=minimal"
      },
      body: JSON.stringify(body),
      keepalive: true
    }).catch(() => {});
  } catch { /* fire and forget */ }
}

/* Vacía la cola intentando enviar lo pendiente.
   - Procesa hasta BATCH_SIZE items por pasada.
   - Si la red cae (networkFail), corta para no martillar.
   - Si un item lo rechaza el server (data inválida), sigue con los demás
     en lugar de bloquear toda la cola. */
const BATCH_SIZE = 20;
let flushing = false;
async function flushQueue() {
  if (flushing) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    updatePendingIndicator();
    return;
  }
  flushing = true;
  try {
    const arr = readQueue();
    if (!arr.length) return;

    const batch = arr.slice(0, BATCH_SIZE);
    let historyChanged = false;
    for (const item of batch) {
      const r = await trySendOneReport(item.payload);
      if (r.ok) {
        removeFromQueue(item.id);
        if (setHistoryItemStatus(item.legajo, item.fecha, item.id, "sent", new Date().toISOString(), r.created_at)) {
          historyChanged = true;
        }
      } else {
        // Anotar intento en la cola
        const cur = readQueue();
        const i = cur.findIndex(x => x.id === item.id);
        let newAttempts = (item.attempts || 0) + 1;
        if (i >= 0) {
          cur[i].attempts = newAttempts;
          cur[i].lastTry  = Date.now();
          cur[i].lastErr  = r.networkFail ? "network" : `server_${r.status||"?"}`;
          writeQueue(cur);
          newAttempts = cur[i].attempts;
        }
        // Auditoría remota: 1er intento y cada 5 (para no spamear)
        if (newAttempts === 1 || newAttempts % 5 === 0) {
          logErrorToAudit(item.payload, newAttempts, r);
        }
        // Solo marcar "failed" en el historial si fue rechazo del server.
        // Si fue networkFail, dejarlo como "queued" — va a reintentar solo.
        if (!r.networkFail) {
          if (setHistoryItemStatus(item.legajo, item.fecha, item.id, "failed")) {
            historyChanged = true;
          }
        }
        // Red caída: no insistir con el resto del batch.
        if (r.networkFail) break;
        // Server rejection: seguir con el próximo item de la cola.
      }
    }
    // Si la pantalla de legajo está visible y cambió algún status, refresco.
    if (historyChanged && legajoInput && !legajoScreen.classList.contains("hidden")) {
      renderLegajoHistory(legajoInput.value);
    }
  } finally {
    flushing = false;
    updatePendingIndicator();
  }
}

const APP_VERSION = "v1.43";

function updatePendingIndicator() {
  const el = document.getElementById("pendingIndicator");
  const q = readQueue();
  const count = q.length;
  if (el) {
    if (count > 0) {
      el.style.display = "block";
      el.textContent = `⚠️ ${count} reporte(s) sin enviar — se reenviarán al volver la red`;
    } else {
      el.style.display = "none";
      el.textContent = "";
    }
  }
  // Badge de versión + estado (siempre visible en esquina inferior derecha)
  const vb = document.getElementById("versionBadge");
  if (vb) {
    if (count === 0) {
      vb.textContent = `${APP_VERSION} ✓`;
      vb.className = "";
    } else if (q.some(x => x.lastErr && !x.lastErr.startsWith("network"))) {
      vb.textContent = `${APP_VERSION} ⚠ ${count}`;
      vb.className = "error";
    } else {
      vb.textContent = `${APP_VERSION} ⏳ ${count}`;
      vb.className = "pending";
    }
  }
}

/* ============ DESHACER ÚLTIMO MENSAJE (60s) ============ */
let _lastSentReport = null;     // { payload, legajo, prevState }
let _undoTimerId    = null;
const UNDO_WINDOW_MS = 60000;

function showUndoBanner() {
  if (!_lastSentReport) return;
  const banner = document.getElementById("undoBanner");
  const text   = document.getElementById("undoBannerText");
  if (!banner || !text) return;
  banner.classList.remove("hidden");
  const start = Date.now();
  function updateText() {
    const remaining = Math.ceil((UNDO_WINDOW_MS - (Date.now() - start)) / 1000);
    if (remaining <= 0) {
      _lastSentReport = null;
      hideUndoBanner();
      return;
    }
    const p = _lastSentReport.payload;
    const tx = p.texto ? ` "${p.texto}"` : "";
    text.textContent = `↩ Último: ${p.opcion}${tx} — ${remaining}s`;
  }
  updateText();
  if (_undoTimerId) clearInterval(_undoTimerId);
  _undoTimerId = setInterval(updateText, 1000);
}

function hideUndoBanner() {
  const banner = document.getElementById("undoBanner");
  if (banner) banner.classList.add("hidden");
  if (_undoTimerId) { clearInterval(_undoTimerId); _undoTimerId = null; }
}

async function undoLastSent() {
  if (!_lastSentReport) return;
  if (!confirm("¿Borrar este último mensaje?")) return;
  const { payload, prevState, legajo } = _lastSentReport;
  // 1) Restaurar el estado local previo (picking/armado/toggles).
  setLegajoState(legajo, prevState);
  // 2) Sacar del queue (por si todavía no se sincronizó).
  removeFromQueue(payload.id);
  // 3) Sacar del historial local.
  const fecha = isoToDayKey(payload.ts);
  const hist  = readDayHist(fecha, legajo);
  writeDayHist(fecha, legajo, hist.filter(it => it.id !== payload.id));
  // 4) DELETE en Supabase (fire-and-forget — si no llegó, 404 silencioso).
  fetch(SUPABASE_TABLE_ENDPOINT + "?client_id=eq." + encodeURIComponent(payload.id), {
    method: "DELETE",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  }).catch(() => {});
  // 5) Limpiar el banner.
  _lastSentReport = null;
  hideUndoBanner();
  // 6) Refrescar UI.
  renderLegajoHistory(legajo);
  updateCoreButtonsState();
  renderPendingSuggestion();
  updatePendingIndicator();
  alert("Mensaje deshecho.");
}

async function send() {
  const legajoStr   = String(legajoInput.value || "");
  const opcion      = selected;
  const descripcion = desc[selected] || "";
  const texto       = (textInput.value || "").toUpperCase();

  if (!legajoStr) { alert("Falta el número de legajo"); return; }
  if (!opcion)    { alert("Falta seleccionar una opción"); return; }

  // ID único por reporte: permite dedup en el server (UNIQUE en client_id).
  const nowMs  = Date.now();
  const nowIso = new Date(nowMs).toISOString();
  const payload = {
    legajo: legajoInput.value,
    opcion,
    descripcion,
    texto,
    ts: nowMs,
    id: nowMs.toString(36) + "_" + Math.random().toString(36).slice(2, 8),
    ts_inicio_iso: null   // se completa abajo si esta acción es un CIERRE
  };

  /* ---- snapshot del estado para "Deshacer" (ANTES de mutarlo) ---- */
  const stateBeforeChange = JSON.parse(JSON.stringify(getLegajoState(legajoStr)));

  /* ---- ts_inicio para cierres (capturar ANTES de modificar el estado) ---- */
  if (opcion === "TP") {
    const st = getLegajoState(legajoStr);
    payload.ts_inicio_iso = (st.picking && st.picking.ts_inicio) || null;
  } else if (opcion === "TAP") {
    const st = getLegajoState(legajoStr);
    payload.ts_inicio_iso = (st.armado && st.armado.ts_inicio) || null;
  } else if (TOGGLE_CODES.includes(opcion)) {
    const st = getLegajoState(legajoStr);
    const cur = st.toggles && st.toggles[opcion];
    // string = ISO de apertura (estamos cerrando); true = legacy sin ts; undefined = abriendo
    if (typeof cur === "string") payload.ts_inicio_iso = cur;
  }

  /* ---- historial local ---- */
  pushHistoryForLegajo(legajoStr, {
    ts: payload.ts, opcion, descripcion, texto,
    id: payload.id,                          // permite actualizar el status cuando se confirme el envío
    ts_inicio_iso: payload.ts_inicio_iso || null,  // necesario para "replay" desde Terminar Día
    status: "queued"
  });

  /* ---- estado / pendientes locales ---- */
  if (opcion === "EP") {
    const st = getLegajoState(legajoStr);
    st.picking = { active:true, value:texto, ts_inicio: nowIso };
    setLegajoState(legajoStr, st);
  } else if (opcion === "TP") {
    const st = getLegajoState(legajoStr);
    st.picking = { active:false, value:"", ts_inicio: null };
    setLegajoState(legajoStr, st);
  } else if (opcion === "AP") {
    const st = getLegajoState(legajoStr);
    st.armado = { active:true, value:texto, ts_inicio: nowIso };
    setLegajoState(legajoStr, st);
  } else if (opcion === "TAP") {
    const st = getLegajoState(legajoStr);
    st.armado = { active:false, value:"", ts_inicio: null };
    setLegajoState(legajoStr, st);
  } else if (TOGGLE_CODES.includes(opcion)) {
    // 1ra vez abre (guarda ts ISO); 2da vez cierra (borra)
    toggleStartOrEnd(legajoStr, opcion);
  }

  /* ---- ENCOLAR SIEMPRE antes de tocar la red ---- */
  enqueueReport(payload);

  // Hay 2 botones Enviar (uno inline al lado del label, otro abajo). Updateo
  // ambos así no importa cuál esté visible.
  const sendBtns = document.querySelectorAll(".send-btn-shared");
  sendBtns.forEach(b => { b.disabled = true; b.innerText = "Enviando..."; });

  const r = await trySendOneReport(payload);

  sendBtns.forEach(b => { b.disabled = false; b.innerText = "Enviar"; });

  if (r.ok) {
    removeFromQueue(payload.id);
    setHistoryItemStatus(legajoStr, getTodayKey(), payload.id, "sent", new Date().toISOString(), r.created_at);
    alert("Reporte enviado correctamente");
  } else {
    // Si fue rechazo del server (datos inválidos, etc.) marco "failed" en el historial.
    // Si fue caída de red, dejo "queued" — se reintenta solo.
    if (!r.networkFail) {
      setHistoryItemStatus(legajoStr, getTodayKey(), payload.id, "failed");
    }
    alert("⚠️ Sin conexión o sin respuesta del servidor.\nTu reporte quedó guardado y se reenviará automáticamente cuando vuelva la red.");
  }

  resetSelection();
  optionsScreen.classList.add("hidden");
  legajoScreen.classList.remove("hidden");
  document.getElementById("btnHistDias")?.classList.remove("hidden");

  // No se borra el legajo: el operario suele encadenar varios reportes seguidos.
  // Para cambiar de operario alcanza con tocar el input y reescribir.
  renderLegajoHistory(legajoInput.value);
  updateCoreButtonsState();
  renderPendingSuggestion();
  updatePendingIndicator();

  // Habilitar "Deshacer" para este último mensaje (60s).
  _lastSentReport = { payload, legajo: legajoStr, prevState: stateBeforeChange };
  showUndoBanner();

  // Por si quedaron otros pendientes acumulados de intentos previos.
  flushQueue();
}

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
    // Re-chequear updates cada 60 s por si hubo deploy nuevo.
    setInterval(() => { reg.update().catch(() => {}); }, 60000);
  } catch (e) {
    console.warn("SW no se pudo registrar:", e);
  }
}

/* Asegura que todo lo de LS también esté en IDB (caso típico: instalación
   previa al SW, items viejos en LS sin reflejar en IDB todavía). */
async function migrateQueueToIDB() {
  const ls = readQueue();
  for (const it of ls) {
    try { await idbPut(it); } catch {}
  }
}

/* El SW nos avisa cuando manda un item con éxito (ver postMessage en sw.js).
   Lo borramos de LS y actualizamos el historial en tiempo real, sin depender
   de inferencias frágiles del tipo "está en LS pero no en IDB". */
function handleServiceWorkerMessage(event) {
  const d = event.data;
  if (!d || d.type !== "ITEM_SENT") return;
  // Limpiar de la cola local
  const filtered = readQueue().filter(it => it.id !== d.id);
  writeQueue(filtered);
  // Marcar como ✓ enviado en el historial
  if (d.legajo && d.fecha && d.id) {
    setHistoryItemStatus(d.legajo, d.fecha, d.id, "sent", new Date().toISOString(), d.createdAt);
  }
  updatePendingIndicator();
  // Re-render si el operario está mirando la pantalla de legajo
  if (legajoInput && !legajoScreen.classList.contains("hidden")) {
    renderLegajoHistory(legajoInput.value);
  }
}

/* ============================================================
   QR DE FICHADA (TOTP rotativo) — integración con FichadaQR
   ============================================================
   El QR de la esquina inferior derecha genera tokens HMAC-SHA256
   cada 30s. Cada token se codifica en una URL que apunta al form
   de FichadaQR (https://loekemeyer.github.io/FichadaQR/?t=...).
   El operario escanea con el celu, abre el form, marca Entrada/
   Comida Inicia/Comida Termina/Salida y envía a un Google Form.

   El secreto, periodo y demás vienen de fichada-config.js — mismo archivo
   que carga fichada.html, así no se desincronizan. */
const FICHADA_HMAC_SECRET = (window.FICHADA_CONFIG && window.FICHADA_CONFIG.hmacSecret) || "";
const FICHADA_PERIOD_SEC  = (window.FICHADA_CONFIG && window.FICHADA_CONFIG.tokenPeriodSec) || 30;
function buildFichadaUrl(token) {
  // URL absoluta hacia fichada.html en el mismo dominio, con el token como
  // query string. El celu del operario lo escanea y aterriza en el form.
  const u = new URL("./fichada.html", location.href);
  u.searchParams.set("t", token);
  return u.toString();
}

async function _fichadaHmacSha256Hex(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    "raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
  );
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(message));
  return Array.from(new Uint8Array(sig))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}
function _fichadaCurrentBucket(periodSec) {
  return Math.floor(Date.now() / 1000 / periodSec);
}
async function _fichadaBuildToken(secret, periodSec) {
  const bucket = _fichadaCurrentBucket(periodSec);
  const sig = (await _fichadaHmacSha256Hex(secret, String(bucket))).slice(0, 16);
  return bucket + "." + sig;
}
function _fichadaSecondsUntilNext(periodSec) {
  const nowSec = Date.now() / 1000;
  const nextStart = (Math.floor(nowSec / periodSec) + 1) * periodSec;
  return nextStart - nowSec;
}

let _qrLastToken = null;

/* ⚠ FLAG TEMPORAL: deshabilita el QR rotativo y muestra cartel
   "EN CONSTRUCCIÓN" en su lugar. Activado mientras se debuggea el
   bridge al Google Sheet de fichadas Esnaola. Para reactivar el QR
   cuando el flujo end-to-end (Supabase + Sheet) esté confirmado:
   cambiar a `false` y bumpear version. */
const QR_DISABLED = true;

/* Cartel "EN CONSTRUCCIÓN" pintado en el canvas en vez del QR.
   Naranja para que sea bien visible desde lejos en la TV. */
function _qrRenderConstruccion(canvas) {
  const size = 320;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  // fondo amarillo bandera
  ctx.fillStyle = "#fde68a";
  ctx.fillRect(0, 0, size, size);
  // borde naranja
  ctx.strokeStyle = "#ea580c";
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, size - 8, size - 8);
  // icono ⚠
  ctx.fillStyle = "#9a3412";
  ctx.font = "bold 80px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("⚠", size / 2, size / 2 - 50);
  // texto principal
  ctx.font = "bold 32px system-ui, sans-serif";
  ctx.fillText("EN", size / 2, size / 2 + 30);
  ctx.fillText("CONSTRUCCIÓN", size / 2, size / 2 + 70);
}

/* Render usando qrcode-generator (variable global "qrcode"). Pinta el QR
   directamente en el canvas con fillRect por cada módulo. */
function _qrRenderToCanvas(canvas, text, opts) {
  const ecc  = (opts && opts.errorCorrectionLevel) || "M";
  const size = (opts && opts.width) || 320;
  const margin = (opts && opts.margin) || 1;
  const dark = (opts && opts.color && opts.color.dark) || "#000000";
  const light = (opts && opts.color && opts.color.light) || "#ffffff";

  const qr = qrcode(0, ecc);   // 0 = typeNumber auto
  qr.addData(text);
  qr.make();
  const moduleCount = qr.getModuleCount();
  const totalMods = moduleCount + margin * 2;
  const moduleSize = size / totalMods;

  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = light;
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = dark;
  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if (qr.isDark(row, col)) {
        ctx.fillRect(
          Math.floor((col + margin) * moduleSize),
          Math.floor((row + margin) * moduleSize),
          Math.ceil(moduleSize),
          Math.ceil(moduleSize)
        );
      }
    }
  }
}

async function tickFichadaQr() {
  const canvas = document.getElementById("qrCanvas");
  const secsEl = document.getElementById("qrSecs");
  if (!canvas || !secsEl) return;
  if (typeof qrcode === "undefined") return;
  try {
    const token = await _fichadaBuildToken(FICHADA_HMAC_SECRET, FICHADA_PERIOD_SEC);
    if (token !== _qrLastToken) {
      _qrLastToken = token;
      const url = buildFichadaUrl(token);
      _qrRenderToCanvas(canvas, url, {
        width: 320, margin: 1, errorCorrectionLevel: "M",
        color: { dark: "#202124", light: "#ffffff" }
      });
    }
    const left = _fichadaSecondsUntilNext(FICHADA_PERIOD_SEC);
    secsEl.textContent = String(Math.max(0, Math.ceil(left)));
  } catch (e) {
    console.warn("[QR] tick error:", e.message || e);
    secsEl.textContent = "err";
  }
}
let _qrStartAttempts = 0;
function _startFichadaQr() {
  // Bypass del QR rotativo mientras se debuggea el bridge al sheet.
  // Pinta el cartel "EN CONSTRUCCIÓN" una vez y no arranca ticks.
  if (QR_DISABLED) {
    const canvas = document.getElementById("qrCanvas");
    const secsEl = document.getElementById("qrSecs");
    const labelEl = document.querySelector("#qrFichadaBox .qr-label");
    const countdownEl = document.querySelector("#qrFichadaBox .qr-countdown");
    if (canvas) _qrRenderConstruccion(canvas);
    if (labelEl) labelEl.textContent = "Fichada";
    // Escondemos el contador (no tiene sentido sin tokens rotando).
    if (countdownEl) countdownEl.style.display = "none";
    if (secsEl) secsEl.textContent = "—";
    console.log("[QR] Deshabilitado — mostrando cartel En Construcción");
    return;
  }
  if (typeof qrcode === "undefined") {
    _qrStartAttempts++;
    if (_qrStartAttempts > 50) {
      console.error("[QR] La librería qrcode no cargó (qrcode.js falta?).");
      const secsEl = document.getElementById("qrSecs");
      if (secsEl) secsEl.textContent = "sin lib";
      return;
    }
    setTimeout(_startFichadaQr, 200);
    return;
  }
  console.log("[QR] qrcode-generator lista, arrancando ticks");
  tickFichadaQr();
  setInterval(tickFichadaQr, 250);
}
_startFichadaQr();
