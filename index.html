/* =========================================================
   MONITOR DE OPERARIOS (supervisor)
   - Lee Google Sheet (pestaña Programación) vía CSV publicado.
   - Toma filas con Op=SI.
   - Agrupa por Tanda (col A). Suma M3, toma Fecha Entrega.
   - Cruza contra Supabase eventos EP/TP/AP/TAP (texto=Tanda) para
     determinar status Picking y Separado de cada tanda.
   - Auto-refresh cada 3 s mientras el modal esté abierto.
   ========================================================= */
/* Endpoint gviz: NO usa el cache CDN de "publicar en la web" (1-5 min),
   refleja los cambios en segundos. Requiere que el Google Sheet esté
   compartido como "Anyone with the link → Viewer". Si no está compartido,
   el endpoint devuelve HTML de login y el monitor muestra error. */
const MONITOR_CSV_URL =
  "https://docs.google.com/spreadsheets/d/1-16YXe0xq6x9i-Yhk5cm5V3VqvQ0PWZtcDbm8OeeKW0/gviz/tq?tqx=out:csv&gid=1947169223";

/* Hoja "PPP Excel Pedidos Entregados 2026" — fallback de M3 para tandas
   que ya no están en la programación diaria. Mismo documento, otro gid.
   Refrescada en cache cada 5 min. */
const MONITOR_HISTORIC_CSV_URL =
  "https://docs.google.com/spreadsheets/d/1-16YXe0xq6x9i-Yhk5cm5V3VqvQ0PWZtcDbm8OeeKW0/gviz/tq?tqx=out:csv&gid=2146771217";
const HISTORIC_REFRESH_MS = 5 * 60 * 1000;
let historicMap        = null;   // Map<tandaUpper, m3 sumado>
let historicLastFetch  = 0;
let historicInflight   = null;   // Promise para evitar fetch en paralelo

const MONITOR_REFRESH_MS = 1000;     // ciclo principal — refresca eventos Supabase
const PPP_TTL_MS         = 3000;     // PPP (Google Sheet) cacheado este tiempo
let monitorIntervalId = null;
let monitorLastOkTs   = 0;
let _pppCache         = null;
let _pppCacheTs       = 0;
let beyondExpanded    = false;   // estado del card "+ Fuera de ventana"
let _monitorSheetCache = null;   // último sheetMap renderizado (para showTandaDetail)
let _monitorTotalCache = null;   // último totalByDate (para showCamionDetail)
let _prevStatusMap     = new Map();   // último statusMap para detectar cambios y flashar
let _audioCtx          = null;        // creado en el primer click (autoplay policy)

function playMonitorBeep() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);   // A5
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) { /* audio bloqueado por el browser, ignorar */ }
}

function toggleBeyondDetail() {
  beyondExpanded = !beyondExpanded;
  const card = document.querySelector(".beyond-card");
  if (card) card.classList.toggle("expanded", beyondExpanded);
}

/* Muestra modal con los NP que componen una tanda y su m3 individual.
   Disparado desde el onclick del <td class="monitor-tanda" data-tanda="...">. */
function showTandaDetail(tandaCode) {
  if (!_monitorSheetCache || !tandaCode) return;
  const entry = _monitorSheetCache.get(String(tandaCode).toUpperCase());
  if (!entry) { alert("Tanda no encontrada: " + tandaCode); return; }
  const pedidos = entry.pedidos || [];
  let bodyHtml = `
    <div style="font-size:14px; color:#475569; margin-bottom:12px;">
      <b>Total:</b> ${pedidos.length} NP · ${entry.m3.toFixed(3).replace(".", ",")} m3
    </div>`;
  if (!pedidos.length) {
    bodyHtml += `<div class="history-empty">Sin NPs registrados.</div>`;
  } else {
    bodyHtml += `
      <table class="tanda-modal-table">
        <thead>
          <tr><th>N° NP</th><th>Razon Social</th><th class="num">M3</th></tr>
        </thead>
        <tbody>`;
    for (const p of pedidos) {
      bodyHtml += `
          <tr>
            <td>${escapeHtml(p.np || "—")}</td>
            <td>${escapeHtml(p.razonSocial || "")}</td>
            <td class="num">${(p.m3 || 0).toFixed(3).replace(".", ",")}</td>
          </tr>`;
    }
    bodyHtml += `</tbody></table>`;
  }
  const m = document.getElementById("tandaModal");
  m.querySelector(".tanda-modal-title").textContent = "Tanda " + entry.tanda;
  m.querySelector(".tanda-modal-body").innerHTML = bodyHtml;
  m.classList.add("show");
}

function closeTandaModal() {
  document.getElementById("tandaModal").classList.remove("show");
}

/* Muestra modal con el desglose de rendimiento por operario para un día.
   Por cada legajo: m3 picqueados, m3 armados, total m3, horas trabajadas
   (1ra → última acción) y promedio m3/h. Reusa el tandaModal. */
async function showDayBreakdown(dayKey, dayLabel) {
  if (!dayKey) return;
  const m = document.getElementById("tandaModal");
  m.querySelector(".tanda-modal-title").textContent = "Rendimiento del día " + (dayLabel || dayKey);
  m.querySelector(".tanda-modal-body").innerHTML = `<div class="history-empty">Cargando…</div>`;
  m.classList.add("show");
  try {
    // Fetch eventos del día completo (00:00 a 23:59:59 hora Argentina).
    // ts_inicio se trae también porque para PC (Paré Comida) la duración
    // del corte es ts_cliente - ts_inicio (es un toggle: abre y cierra).
    const dayStartIso = new Date(`${dayKey}T00:00:00-03:00`).toISOString();
    const dayEndIso   = new Date(`${dayKey}T23:59:59-03:00`).toISOString();
    const evUrl = SUPABASE_TABLE_ENDPOINT +
      "?ts_cliente=gte." + encodeURIComponent(dayStartIso) +
      "&ts_cliente=lte." + encodeURIComponent(dayEndIso) +
      "&order=ts_cliente.asc" +
      "&limit=5000" +
      "&select=opcion,texto,legajo,ts_cliente,ts_inicio";
    // Fichadas de ingreso del día (la pueden haber registrado varias veces
    // por error → nos quedamos con la PRIMERA del día por legajo).
    const fichUrl = SUPABASE_FICHADAS_ENDPOINT +
      "?ts_cliente=gte." + encodeURIComponent(dayStartIso) +
      "&ts_cliente=lte." + encodeURIComponent(dayEndIso) +
      "&tipo=eq.ingreso" +
      "&order=ts_cliente.asc" +
      "&limit=2000" +
      "&select=email,legajo,ts_cliente";
    const [r, rf] = await Promise.all([
      fetch(evUrl,   { headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY } }),
      fetch(fichUrl, { headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY } })
    ]);
    if (!r.ok)  throw new Error("Supabase HTTP " + r.status);
    if (!rf.ok) throw new Error("Fichadas HTTP " + rf.status);
    const events   = await r.json();
    const fichadas = await rf.json();

    // Para fichadas sin legajo cargado, intento resolverlo ahora trayendo
    // todos los emails de Empleados (tabla chica, ~200 filas máx) y
    // comparando case-insensitive lado cliente. Más robusto que el filtro
    // PostgREST in.(...) que sería case-sensitive y exigiría escaping
    // complicado de strings con comas/comillas.
    const emailsSinLegajo = [...new Set(
      fichadas
        .filter(f => !f.legajo && f.email)
        .map(f => String(f.email).toLowerCase().trim())
    )];
    let emailToLegajo = new Map();
    if (emailsSinLegajo.length) {
      try {
        const empUrl = SUPABASE_EMPLEADOS_ENDPOINT +
          "?email=not.is.null&select=Legajo,email&limit=2000";
        const re = await fetch(empUrl, { headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY } });
        if (re.ok) {
          const emps = await re.json();
          for (const e of emps) {
            if (e.email && e.Legajo != null) {
              emailToLegajo.set(String(e.email).toLowerCase().trim(), String(e.Legajo));
            }
          }
        }
      } catch (_) { /* best-effort: si falla seguimos sin legajo */ }
    }

    // Ingreso por legajo: nos quedamos con el ts_cliente MÁS TEMPRANO del
    // día. Si una misma persona escaneó dos veces el QR, el primer ingreso
    // gana (los siguientes son ruido/error).
    const ingresoByLegajo = new Map();      // legajo -> Date
    const emailByLegajo   = new Map();      // legajo -> email (para mostrar)
    const fichadasSinLegajo = [];           // ingresos cuyo email no está en Empleados
    for (const f of fichadas) {
      let leg = f.legajo;
      if (!leg && f.email) {
        // .trim() para que coincida con la clave normalizada del Map
        // (que sí trimea). Sin esto, " a@b.com" no matchearía a "a@b.com".
        leg = emailToLegajo.get(String(f.email).toLowerCase().trim()) || null;
      }
      const tsIngreso = new Date(f.ts_cliente);
      if (!leg) {
        fichadasSinLegajo.push({ email: f.email || "(sin email)", ts: tsIngreso });
        continue;
      }
      const legStr = String(leg);
      const prev = ingresoByLegajo.get(legStr);
      if (!prev || tsIngreso < prev) ingresoByLegajo.set(legStr, tsIngreso);
      if (f.email) emailByLegajo.set(legStr, f.email);
    }

    // Agrupar eventos por legajo. Además de pickeds/armadas, calculamos
    // sumatoria de PC (duración de comidas) y el FJ del día si existe.
    const perLegajo = new Map();
    for (const ev of events) {
      const leg = String(ev.legajo || "").trim();
      if (!leg) continue;
      if (!perLegajo.has(leg)) perLegajo.set(leg, {
        firstTs: ev.ts_cliente,
        lastTs: ev.ts_cliente,
        pickedTandas: new Set(),
        armedTandas: new Set(),
        comidaMs: 0,
        fjTs: null
      });
      const p = perLegajo.get(leg);
      p.lastTs = ev.ts_cliente;
      const tanda = (ev.texto || "").trim().toUpperCase();
      if (tanda) {
        if (ev.opcion === "TP")  p.pickedTandas.add(tanda);
        if (ev.opcion === "TAP") p.armedTandas.add(tanda);
      }
      if (ev.opcion === "PC" && ev.ts_inicio) {
        const dur = new Date(ev.ts_cliente) - new Date(ev.ts_inicio);
        if (dur > 0 && dur < 8 * 3600 * 1000) p.comidaMs += dur; // tope: 8h sanity
      }
      if (ev.opcion === "FJ") {
        // Último FJ del día gana (raros casos de doble FJ).
        p.fjTs = ev.ts_cliente;
      }
    }

    // Mergeamos legajos que solo aparecen en fichadas (fichó pero no
    // mandó ninguna acción todavía) para que aparezcan en la tabla.
    for (const [leg, ts] of ingresoByLegajo.entries()) {
      if (!perLegajo.has(leg)) {
        perLegajo.set(leg, {
          firstTs: ts.toISOString(),
          lastTs:  ts.toISOString(),
          pickedTandas: new Set(),
          armedTandas:  new Set(),
          comidaMs: 0,
          fjTs: null
        });
      }
    }

    if (!perLegajo.size && !fichadasSinLegajo.length) {
      m.querySelector(".tanda-modal-body").innerHTML = `<div class="history-empty">Sin registros para ese día.</div>`;
      return;
    }
    // Resolver m3 por tanda (sheetMap actual → histórico → 0)
    const sheetMap = _monitorSheetCache || new Map();
    const historic = await getHistoricMap();
    const tandaM3 = (t) => {
      const e = sheetMap.get(t);
      if (e) return e.m3;
      return historic.get(t) || 0;
    };
    // Calcular fila por legajo y ordenar por m3 total desc
    const rows = [...perLegajo.entries()].map(([leg, p]) => {
      const m3Pick = [...p.pickedTandas].reduce((s, t) => s + tandaM3(t), 0);
      const m3Arm  = [...p.armedTandas ].reduce((s, t) => s + tandaM3(t), 0);
      const m3Total = m3Pick + m3Arm;
      // Horas "trabajadas" (primer evento → último evento) — se mantiene
      // para no romper la comparación histórica, pero la jornada nueva
      // usa ingreso + FJ + descuento de PC.
      const horas = Math.max(0, (new Date(p.lastTs) - new Date(p.firstTs)) / 3600000);
      const m3PerH = horas > 0 ? m3Total / horas : 0;

      // ===== Jornada =====
      const ingreso  = ingresoByLegajo.get(leg) || null;
      const fjTs     = p.fjTs ? new Date(p.fjTs) : null;
      const comidaH  = p.comidaMs / 3600000;
      let jornadaH   = null;
      let jornadaNota = "";
      if (ingreso && fjTs) {
        jornadaH = Math.max(0, (fjTs - ingreso) / 3600000 - comidaH);
      } else if (ingreso && !fjTs) {
        // Si todavía no terminó la jornada, mostramos provisional con
        // último evento o "ahora" (si el día es hoy).
        const endTs = isTodayKey(dayKey) ? new Date() : new Date(p.lastTs);
        jornadaH = Math.max(0, (endTs - ingreso) / 3600000 - comidaH);
        jornadaNota = isTodayKey(dayKey) ? " *(en curso)*" : " *(sin FJ)*";
      } else if (!ingreso && fjTs) {
        jornadaNota = " *(sin ingreso)*";
      } else {
        jornadaNota = " *(sin ingreso)*";
      }

      return {
        leg, m3Pick, m3Arm, m3Total, horas, m3PerH,
        ingreso, fjTs, comidaH, jornadaH, jornadaNota,
        email: emailByLegajo.get(leg) || ""
      };
    }).sort((a, b) => b.m3Total - a.m3Total);
    const fmt = (n, d=1) => (n||0).toFixed(d).replace(".", ",");
    const hhmm = (d) => {
      if (!d) return "—";
      // Mostramos en hora Argentina (UTC-3 fijo).
      const ar = new Date(d.getTime() - 0); // d ya es Date; ajuste de TZ con toLocale
      try {
        return ar.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Argentina/Buenos_Aires" });
      } catch { return ar.toISOString().slice(11, 16); }
    };
    const jornadaCell = (r) => {
      if (r.jornadaH == null) return `<span style="color:#94a3b8">${escapeHtml(r.jornadaNota.replace(/\*/g,'') || '—')}</span>`;
      const txt = fmt(r.jornadaH, 2) + " h";
      const nota = r.jornadaNota ? ` <span style="color:#94a3b8;font-size:11px">${escapeHtml(r.jornadaNota.replace(/\*/g,''))}</span>` : "";
      return `<b>${txt}</b>${nota}`;
    };
    const sinLegajoHtml = fichadasSinLegajo.length ? `
      <div style="margin-top:14px;padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;font-size:13px;color:#9a3412;">
        ⚠ <b>${fichadasSinLegajo.length} fichada(s)</b> sin legajo (email no linkeado en Empleados).
        <div style="font-size:11px;color:#c2410c;margin-top:2px;margin-bottom:6px;">
          Click en el email para copiarlo y pegarlo en Supabase Studio → tabla "Empleados" → columna email.
        </div>
        ${fichadasSinLegajo.map(f => `
          <div style="margin-top:4px">
            <span class="copy-email" data-email="${escapeHtml(f.email)}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;" title="Click para copiar"
                  onclick="copyEmailFromSpan(this)">${escapeHtml(f.email)}</span>
            — ${hhmm(f.ts)}
          </div>
        `).join("")}
      </div>` : "";
    const bodyHtml = `
      <div style="font-size:14px; color:#475569; margin-bottom:12px;">
        <b>${perLegajo.size} operario(s)</b> trabajaron el día <b>${escapeHtml(dayLabel || dayKey)}</b>
      </div>
      <table class="tanda-modal-table">
        <thead>
          <tr>
            <th>Legajo</th>
            <th class="num">Ingreso</th>
            <th class="num">FJ</th>
            <th class="num">PC</th>
            <th class="num">Jornada</th>
            <th class="num">Picking m3</th>
            <th class="num">Armado m3</th>
            <th class="num">Total m3</th>
            <th class="num">m3/h jornada</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => {
            const m3PerHJorn = (r.jornadaH && r.jornadaH > 0) ? r.m3Total / r.jornadaH : 0;
            return `
            <tr>
              <td><b>${escapeHtml(r.leg)}</b>${r.email ? `<div style="font-size:11px;color:#94a3b8">${escapeHtml(r.email)}</div>` : ""}</td>
              <td class="num">${hhmm(r.ingreso)}</td>
              <td class="num">${hhmm(r.fjTs)}</td>
              <td class="num">${r.comidaH > 0 ? fmt(r.comidaH, 2) + " h" : "—"}</td>
              <td class="num">${jornadaCell(r)}</td>
              <td class="num">${fmt(r.m3Pick)}</td>
              <td class="num">${fmt(r.m3Arm)}</td>
              <td class="num"><b>${fmt(r.m3Total)}</b></td>
              <td class="num">${r.jornadaH ? fmt(m3PerHJorn, 2) : "—"}</td>
            </tr>`;
          }).join("")}
          ${(() => {
            // Fila Total equipo — sumas + promedio ponderado de m3/h jornada
            // sobre las jornadas conocidas (rows con jornadaH > 0).
            const tot = rows.reduce((acc, r) => {
              acc.m3Pick  += r.m3Pick;
              acc.m3Arm   += r.m3Arm;
              acc.m3Total += r.m3Total;
              if (r.jornadaH && r.jornadaH > 0) {
                acc.jornadaH += r.jornadaH;
                acc.comidaH  += r.comidaH || 0;
              }
              return acc;
            }, { m3Pick:0, m3Arm:0, m3Total:0, jornadaH:0, comidaH:0 });
            const teamM3PerH = tot.jornadaH > 0 ? tot.m3Total / tot.jornadaH : 0;
            return `
            <tr style="background:#f1f5f9;font-weight:700;border-top:2px solid #94a3b8;">
              <td>Total equipo (${rows.length})</td>
              <td class="num">—</td>
              <td class="num">—</td>
              <td class="num">${tot.comidaH > 0 ? fmt(tot.comidaH, 2) + " h" : "—"}</td>
              <td class="num">${tot.jornadaH > 0 ? fmt(tot.jornadaH, 2) + " h" : "—"}</td>
              <td class="num">${fmt(tot.m3Pick)}</td>
              <td class="num">${fmt(tot.m3Arm)}</td>
              <td class="num">${fmt(tot.m3Total)}</td>
              <td class="num">${tot.jornadaH > 0 ? fmt(teamM3PerH, 2) : "—"}</td>
            </tr>`;
          })()}
        </tbody>
      </table>
      ${sinLegajoHtml}`;
    m.querySelector(".tanda-modal-body").innerHTML = bodyHtml;
  } catch (e) {
    m.querySelector(".tanda-modal-body").innerHTML =
      `<div class="monitor-error">Error: ${escapeHtml(e.message)}</div>`;
  }
}

/* Copia el email del data-attribute al clipboard y da feedback visual.
   Usado en el banner ⚠ Sin legajo del modal de rendimiento — el supervisor
   clickea el email y lo pega en Supabase Studio (tabla Empleados).
   Manejamos browsers viejos sin clipboard API con un fallback textarea. */
function copyEmailFromSpan(el) {
  const email = el.dataset.email || el.textContent || "";
  const showFeedback = (ok) => {
    const orig = el.textContent;
    el.textContent = ok ? `${email} (copiado!)` : `${email} (no se pudo copiar)`;
    setTimeout(() => { el.textContent = orig; }, 1500);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(() => showFeedback(true), () => showFeedback(false));
      return;
    }
    // Fallback: textarea + execCommand (HTTP, browsers viejos)
    const ta = document.createElement("textarea");
    ta.value = email; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    showFeedback(ok);
  } catch { showFeedback(false); }
}

/* Helper: comparar dayKey contra hoy en hora Argentina. */
function isTodayKey(dayKey) {
  try {
    const now = new Date();
    const ar = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Argentina/Buenos_Aires",
      year: "numeric", month: "2-digit", day: "2-digit"
    }).format(now); // "YYYY-MM-DD"
    return ar === dayKey;
  } catch { return false; }
}

/* Muestra modal con las tandas que componen un camión del día y el estado
   de armado individual (verde=armado, rojo=no armado). Reusa el tandaModal. */
function showCamionDetail(dateKey, camion) {
  if (!_monitorTotalCache || !dateKey || !camion) return;
  const dayData = _monitorTotalCache.get(dateKey);
  if (!dayData) return;
  const camData = dayData.byCamion.get(camion);
  if (!camData) { alert("Camión no encontrado: " + camion); return; }
  const tandas = [...camData.tandas].sort((a, b) => a.code.localeCompare(b.code));
  let bodyHtml = `
    <div style="font-size:14px; color:#475569; margin-bottom:12px;">
      <b>Fecha:</b> ${escapeHtml(dayData.fechaDisplay)} ·
      <b>Total:</b> ${camData.tandas.length} tandas · ${camData.sum.toFixed(1).replace(".", ",")} m3 ·
      <b>Armadas:</b> ${camData.tandasArmadas}/${camData.tandas.length}
    </div>
    <table class="tanda-modal-table">
      <thead>
        <tr><th>Tanda</th><th class="num">M3</th><th class="center">Armado</th></tr>
      </thead>
      <tbody>`;
  for (const t of tandas) {
    const cls = t.armado ? "tanda-armado" : "tanda-no-armado";
    const txt = t.armado ? "✓ Sí" : "✗ No";
    bodyHtml += `
        <tr class="${cls}">
          <td>${escapeHtml(t.code)}</td>
          <td class="num">${(t.m3 || 0).toFixed(3).replace(".", ",")}</td>
          <td class="center"><b>${txt}</b></td>
        </tr>`;
  }
  bodyHtml += `</tbody></table>`;
  const m = document.getElementById("tandaModal");
  m.querySelector(".tanda-modal-title").textContent = "Camión " + camion;
  m.querySelector(".tanda-modal-body").innerHTML = bodyHtml;
  m.classList.add("show");
}

function openMonitor() {
  const m = document.getElementById("monitorModal");
  m.classList.add("show");
  // TV mode: forzar con URL ?monitor=tv (la tele bookmarkea esa URL),
  // o auto-detect en pantallas grandes (≥1600px de ancho).
  const urlParams = new URLSearchParams(window.location.search);
  const forceTv = urlParams.get("monitor") === "tv";
  const isLarge = window.innerWidth >= 1600;
  if (forceTv || isLarge) {
    m.classList.add("tv");
  } else {
    m.classList.remove("tv");
  }
  refreshMonitor();
  if (monitorIntervalId) clearInterval(monitorIntervalId);
  monitorIntervalId = setInterval(refreshMonitor, MONITOR_REFRESH_MS);
}

function closeMonitor() {
  const m = document.getElementById("monitorModal");
  m.classList.remove("show");
  m.classList.remove("tv");
  if (monitorIntervalId) { clearInterval(monitorIntervalId); monitorIntervalId = null; }
  // Reset del snapshot — al reabrir, el primer refresh no flashea masivo.
  _prevStatusMap = new Map();
}

function toggleMonitorTV() {
  const m = document.getElementById("monitorModal");
  const btn = document.getElementById("btnMonitorTV");
  const isTV = m.classList.toggle("tv");
  if (isTV) {
    btn.textContent = "⛶ Salir TV";
    if (m.requestFullscreen) m.requestFullscreen().catch(()=>{});
  } else {
    btn.textContent = "📺 TV";
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("monitorModal").classList.contains("show")) {
    closeMonitor();
  }
});

/* Parser CSV simple — soporta campos entre comillas con comas y comillas
   escapadas dobles ("a""b" -> a"b). Suficiente para CSV publicado de Sheets. */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else { field += c; }
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* Convierte "0,289" -> 0.289. "" o no-numérico -> 0. */
function monitorParseM3(s) {
  if (!s) return 0;
  const n = parseFloat(String(s).replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? 0 : n;
}

/* "2026-05-22 0:00:00" o "2026-05-22" o "22/5" -> "22/05". "" si no parsea.
   El endpoint gviz puede devolver la columna Fecha Entrega como "D/M" (sin
   año) si el formato de la celda es corto en el sheet. */
function monitorFmtFecha(s) {
  if (!s) return "";
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[3]}/${m[2]}`;
  const m2 = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m2) return `${m2[1].padStart(2,"0")}/${m2[2].padStart(2,"0")}`;
  const m3 = String(s).match(/^(\d{1,2})\/(\d{1,2})\s*$/);
  if (m3) return `${m3[1].padStart(2,"0")}/${m3[2].padStart(2,"0")}`;
  return String(s).slice(0, 10);
}

/* Parsea fecha de entrega y devuelve "YYYY-MM-DD" para comparar. "" si no parsea.
   También maneja "D/M" sin año (asume año actual). */
function monitorRawFecha(s) {
  if (!s) return "";
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  const m2 = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m2) {
    let y = m2[3]; if (y.length === 2) y = "20" + y;
    return `${y}-${m2[2].padStart(2,"0")}-${m2[1].padStart(2,"0")}`;
  }
  const m3 = String(s).match(/^(\d{1,2})\/(\d{1,2})\s*$/);
  if (m3) {
    const y = new Date().getFullYear();
    return `${y}-${m3[2].padStart(2,"0")}-${m3[1].padStart(2,"0")}`;
  }
  return "";
}

/* Extrae el "camión" de un código de tanda: la primera secuencia de dígitos.
   Ej: C03A → "03", C03B → "03" (mismo camión), B58E → "58".
   Si no hay dígitos (RETIRA, LA ANONIMA), devuelve el código tal cual. */
function tandaCamion(code) {
  const m = String(code || "").match(/\d+/);
  return m ? m[0] : String(code || "");
}

/* Fechas a mostrar en el monitor:
   1) TODAS las fechas pasadas que tienen tandas planificadas (Op=SI) sin
      salir del sheet — significa que están atrasadas pero aún en cola.
   2) Las próximas N fechas FUTURAS con tandas planificadas (los días sin
      tandas — feriados, fines de semana — no consumen slot).
   Devuelve array ordenado de "YYYY-MM-DD". N por default = 3. */
function targetDeliveryDates(sheetMap, futureCount) {
  const N = futureCount || 3;
  const d = new Date();
  const todayKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  // Solo fechas que tienen al menos una tanda con Op=SI
  const datesPlanned = new Set();
  for (const v of sheetMap.values()) {
    if (v.fechaEntregaRaw && v.opIsSi) datesPlanned.add(v.fechaEntregaRaw);
  }
  const all = [...datesPlanned].sort();
  const past   = all.filter(x => x <= todayKey);          // todas las pasadas/hoy
  const future = all.filter(x => x >  todayKey).slice(0, N);
  return [...past, ...future];
}

/* Encuentra índice de header buscando fila con "tanda" (substring, para
   tolerar el endpoint gviz que combina título y header → "Programacion Tanda")
   y "op" exacto. */
function findMonitorHeader(rows) {
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const r = rows[i].map(x => (x||"").trim().toLowerCase());
    const hasTanda = r.some(c => c.includes("tanda"));
    if (hasTanda && r.includes("op")) return i;
  }
  return -1;
}

/* Lee el CSV y devuelve mapa Tanda -> { tanda, m3, fechaEntrega }. */
async function fetchMonitorSheet() {
  // cache-busting para evitar respuesta cacheada del CDN de Google
  const url = MONITOR_CSV_URL + "&_=" + Date.now();
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("CSV HTTP " + r.status);
  const text = await r.text();
  const rows = parseCSV(text);
  const headerIdx = findMonitorHeader(rows);
  if (headerIdx < 0) throw new Error("Header no encontrado en CSV");
  const header = rows[headerIdx].map(x => (x||"").trim().toLowerCase());
  // "tanda" busca por substring para tolerar el header concatenado de gviz
  // ("Programacion Tanda"). Las demás cols matchean exactamente.
  const cTanda = header.findIndex(h => h.includes("tanda"));
  const cM3    = header.indexOf("m3");
  const cOp    = header.indexOf("op");
  const cFE    = header.indexOf("fecha entrega");
  const cNP    = header.indexOf("n° np");
  const cRS    = header.indexOf("razon social");
  const acc = new Map();
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r) continue;
    const tanda = (r[cTanda]||"").trim();
    const op    = (r[cOp]||"").trim().toUpperCase();
    const m3 = monitorParseM3(r[cM3]);
    const fe = (r[cFE]||"").trim();
    const np = cNP >= 0 ? (r[cNP]||"").trim() : "";
    const rs = cRS >= 0 ? (r[cRS]||"").trim() : "";
    const feRaw = monitorRawFecha(fe);
    // Filas sin código de tanda: las agrupamos bajo "S/Tanda" por fecha.
    // Si tampoco hay fecha no podemos ubicarlas, skip.
    let displayTanda, mapKey;
    if (tanda) {
      displayTanda = tanda;
      mapKey = tanda.toUpperCase();
    } else if (feRaw) {
      displayTanda = "S/Tanda";
      mapKey = "S/TANDA__" + feRaw;
    } else {
      continue;
    }
    if (!acc.has(mapKey)) acc.set(mapKey, {
      tanda: displayTanda,
      _key: mapKey,                 // identificador único para click handlers
      m3: 0,
      fechaEntrega: monitorFmtFecha(fe),
      fechaEntregaRaw: feRaw,
      // Filas sin código de tanda se consideran planificadas (la operadora
      // todavía no escribió el nro pero el pedido ya está cargado).
      opIsSi: !tanda,
      pedidos: []                   // [{ np, m3, razonSocial }] — alimenta el modal
    });
    const entry = acc.get(mapKey);
    entry.m3 += m3;
    // Si CUALQUIER fila de esta tanda tiene Op=SI, marcamos la tanda como SI.
    if (op === "SI") entry.opIsSi = true;
    if (np || m3) entry.pedidos.push({ np, m3, razonSocial: rs });
  }
  return acc;
}

/* Lee la hoja "PPP Excel Pedidos Entregados 2026" y devuelve
   Map<tandaUpper, m3 total>. Hay varias filas por tanda (una por pedido)
   y sumamos los m3 de col G "Mt3".
   ⚠ NO usar col H "Mt3 FC": pese al nombre, NO es m3 — son códigos chicos
   (zonas/V) tipo 4, 7, 21, 16 que inflaban los totales hasta órdenes de
   magnitud por encima de lo real. Solo col G. */
async function fetchHistoricSheet() {
  const url = MONITOR_HISTORIC_CSV_URL + "&_=" + Date.now();
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("Histórico CSV HTTP " + r.status);
  const text = await r.text();
  const rows = parseCSV(text);
  if (!rows.length) return new Map();
  // Header en fila 0 (sin filas de título arriba como en el sheet principal).
  const header = rows[0].map(x => (x||"").trim().toLowerCase());
  const cTanda = header.indexOf("tanda");
  const cMt3   = header.indexOf("mt3");
  if (cTanda < 0 || cMt3 < 0) {
    throw new Error("Histórico: faltan columnas Tanda/Mt3");
  }
  const acc = new Map();
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r) continue;
    const tanda = (r[cTanda]||"").trim();
    if (!tanda) continue;
    const m3 = monitorParseM3(r[cMt3]);
    const key = tanda.toUpperCase();
    acc.set(key, (acc.get(key) || 0) + m3);
  }
  return acc;
}

/* Cache + lazy refresh. La hoja histórica no cambia tan seguido como la
   programación diaria → refresh cada 5 min. Si un fetch falla, devolvemos
   el cache anterior para no romper el monitor. */
function getHistoricMap() {
  const now = Date.now();
  if (historicMap && (now - historicLastFetch) < HISTORIC_REFRESH_MS) {
    return Promise.resolve(historicMap);
  }
  if (historicInflight) return historicInflight;
  historicInflight = fetchHistoricSheet()
    .then(m => {
      historicMap = m;
      historicLastFetch = Date.now();
      historicInflight = null;
      return m;
    })
    .catch(e => {
      historicInflight = null;
      console.warn("[monitor] histórico:", e.message);
      // Devolvemos el cache anterior (puede ser null en el primer fetch fallido).
      return historicMap || new Map();
    });
  return historicInflight;
}

/* Trae eventos para alimentar el monitor.
   Hace 3 queries:
   A) Eventos EP/TP/AP/TAP filtrados por TANDA (target tandas del sheet)
      sin filtro de fecha — para determinar el status de cada tanda
      (mirando TODOS sus eventos, no solo los de hoy).
   B) Eventos EP/TP/AP/TAP de HOY (cualquier tanda) — para totales del día
      y para detectar tandas trabajadas que no están en el sheet (alertas).
   C) Legajos DISTINTOS de HOY (cualquier opción) — para el cuadro
      "Empleados Trabajando Hoy". PostgREST no tiene DISTINCT, dedup-eamos
      en cliente.
   ⚠ Por qué varias queries: Supabase corta a 1000 filas. Filtrar por tanda
   en (A) mantiene el resultado acotado. (B) y (C) son chicos (~50-300/día).
   Devuelve: { statusMap, alertasOffSheet, empleadosHoy }
     statusMap: TANDA -> { picking, separado, doneTodayP, doneTodayA } */
/* Cache legajo -> nombre (tabla Empleados) para la leyenda del monitor
   "Leg 8: Juan Farias". Refresca cada 1h; ante error mantiene lo cacheado. */
let _empleadosNombres   = new Map();
let _empleadosNombresTs = 0;
const EMPLEADOS_TTL_MS  = 60 * 60 * 1000;
async function getEmpleadosNombres() {
  const now = Date.now();
  if (_empleadosNombres.size && (now - _empleadosNombresTs) < EMPLEADOS_TTL_MS) {
    return _empleadosNombres;
  }
  try {
    const url = SUPABASE_EMPLEADOS_ENDPOINT + "?select=Legajo,Empleado&limit=5000";
    const r = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!r.ok) throw new Error("Supabase HTTP " + r.status);
    const data = await r.json();
    const map = new Map();
    for (const e of data) {
      const leg = String(e.Legajo || "").trim();
      const nom = (e.Empleado || "").trim();
      if (leg && nom) map.set(leg, nom);
    }
    if (map.size) { _empleadosNombres = map; _empleadosNombresTs = Date.now(); }
    return _empleadosNombres;
  } catch (e) {
    console.warn("[monitor] nombres de empleados fetch fallido:", e.message);
    return _empleadosNombres;
  }
}

async function fetchMonitorEvents(targetTandaKeys, sheetMap) {
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startTodayMs = startToday.getTime();
  const endTodayMs   = startTodayMs + 24*60*60*1000;
  const startTodayIso = startToday.toISOString();
  // Ventana extendida: hoy + 10 días para atrás (cubre 5 días productivos
   // aunque haya domingos, feriados o días sin trabajo en el medio).
  const start6DaysIso = new Date(startTodayMs - 10*24*60*60*1000).toISOString();
  const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY };

  // Query A: status por tanda (todos los eventos para target tandas)
  let dataA = [];
  if (targetTandaKeys.length) {
    const urlA = SUPABASE_TABLE_ENDPOINT +
      "?opcion=in.(EP,TP,AP,TAP)" +
      "&texto=in.(" + targetTandaKeys.join(",") + ")" +
      "&order=ts_cliente.asc" +
      "&limit=5000" +
      "&select=opcion,texto,ts_cliente,legajo";
    const rA = await fetch(urlA, { headers });
    if (!rA.ok) throw new Error("Supabase HTTP " + rA.status + " (status query)");
    dataA = await rA.json();
  }

  // Query B: eventos EP/TP/AP/TAP de los últimos 6 días — totales/alertas de
  // hoy + acumulados por día anterior para las filas históricas del monitor.
  const urlB = SUPABASE_TABLE_ENDPOINT +
    "?opcion=in.(EP,TP,AP,TAP)" +
    "&ts_cliente=gte." + encodeURIComponent(start6DaysIso) +
    "&order=ts_cliente.asc" +
    "&limit=10000" +
    "&select=opcion,texto,ts_cliente";
  const rB = await fetch(urlB, { headers });
  if (!rB.ok) throw new Error("Supabase HTTP " + rB.status + " (today query)");
  const dataB = await rB.json();

  // Query C: legajos + ts + opcion de los últimos 6 días (cualquier opción,
  // incluye FJ/Perm/Limp/etc.). Dedup por día en cliente. opcion se usa para
  // marcar quién ya cerró jornada hoy (tiene FJ).
  const urlC = SUPABASE_TABLE_ENDPOINT +
    "?ts_cliente=gte." + encodeURIComponent(start6DaysIso) +
    "&limit=20000" +
    "&select=legajo,ts_cliente,opcion";
  const rC = await fetch(urlC, { headers });
  if (!rC.ok) throw new Error("Supabase HTTP " + rC.status + " (legajos query)");
  const dataC = await rC.json();

  // Query D: fichadas de ingreso de HOY (Supabase Fichadas_Virgilio).
  // Si la query falla (red flaky, RLS mal), no rompemos el monitor — el
  // resumen de ingresos aparecerá vacío y listo.
  const todayStartIso = new Date(startTodayMs).toISOString();
  const todayEndIso   = new Date(endTodayMs).toISOString();
  const urlD = SUPABASE_FICHADAS_ENDPOINT +
    "?ts_cliente=gte." + encodeURIComponent(todayStartIso) +
    "&ts_cliente=lt."  + encodeURIComponent(todayEndIso) +
    "&tipo=eq.ingreso" +
    "&order=ts_cliente.asc" +
    "&limit=2000" +
    "&select=email,legajo,ts_cliente";
  let dataD = [];
  try {
    const rD = await fetch(urlD, { headers });
    if (rD.ok) dataD = await rD.json();
  } catch (_) { dataD = []; }

  // Per-day legajos (dayKey hora Argentina -> Set<legajo>) y per-day legajos
  // que cerraron jornada (FJ). Esto permite saber, dentro del resumen de
  // ingresos del día, cuántos siguen "en jornada" (fichaste pero no FJ).
  const perDayLegajos = new Map();
  const perDayFJ      = new Map();   // dayKey -> Set<legajo> con FJ
  for (const ev of dataC) {
    const legajo = String(ev.legajo || "").trim();
    if (!legajo) continue;
    const dayKey = isoToDayKey(ev.ts_cliente);
    if (!perDayLegajos.has(dayKey)) perDayLegajos.set(dayKey, new Set());
    perDayLegajos.get(dayKey).add(legajo);
    if (ev.opcion === "FJ") {
      if (!perDayFJ.has(dayKey)) perDayFJ.set(dayKey, new Set());
      perDayFJ.get(dayKey).add(legajo);
    }
  }
  const todayKey = isoToDayKey(startTodayMs);
  const empleadosHoy = perDayLegajos.has(todayKey) ? perDayLegajos.get(todayKey).size : 0;

  // Resumen de fichadas de HOY (para el panel del monitor).
  //   total       : cuántos ingresos únicos por legajo se registraron
  //   sinLegajo   : ingresos cuyo email no resuelve a legajo (warning)
  //   enJornada   : con ingreso pero SIN FJ todavía (siguen trabajando)
  //   cerrados    : con ingreso Y FJ (terminaron jornada hoy)
  const fichadosHoyByLeg = new Map();    // legajo -> primer Date
  const fichadosSinLeg   = [];           // [{email, ts}]
  for (const f of dataD) {
    const ts = new Date(f.ts_cliente);
    const leg = f.legajo ? String(f.legajo) : null;
    if (!leg) {
      fichadosSinLeg.push({ email: f.email || "(sin email)", ts });
      continue;
    }
    const prev = fichadosHoyByLeg.get(leg);
    if (!prev || ts < prev) fichadosHoyByLeg.set(leg, ts);
  }
  const fjsHoy = perDayFJ.get(todayKey) || new Set();
  let cerrados = 0, enJornada = 0;
  for (const leg of fichadosHoyByLeg.keys()) {
    if (fjsHoy.has(leg)) cerrados++; else enJornada++;
  }
  const fichadasResumen = {
    total:    fichadosHoyByLeg.size,
    enJornada,
    cerrados,
    sinLegajo: fichadosSinLeg.length
  };

  // Procesar A: último evento de Picking (EP/TP) y Armado (AP/TAP) por tanda.
  // startPick/startArm guardan el legajo del que EMPEZÓ (último EP / último AP)
  // para mostrarlo al lado del ✅/⏰ en el monitor.
  const lastPick = new Map();
  const lastArm  = new Map();
  const startPick = new Map();   // tanda -> { legajo, ts }  (último EP)
  const startArm  = new Map();   // tanda -> { legajo, ts }  (último AP)
  for (const ev of dataA) {
    const t = (ev.texto || "").trim().toUpperCase();
    if (!t) continue;
    const ts  = ev.ts_cliente;
    const leg = String(ev.legajo || "").trim();
    if (ev.opcion === "EP" || ev.opcion === "TP") {
      const cur = lastPick.get(t);
      if (!cur || ts > cur.ts) lastPick.set(t, { opcion: ev.opcion, ts });
      if (ev.opcion === "EP") {
        const cs = startPick.get(t);
        if (!cs || ts > cs.ts) startPick.set(t, { legajo: leg, ts });
      }
    } else if (ev.opcion === "AP" || ev.opcion === "TAP") {
      const cur = lastArm.get(t);
      if (!cur || ts > cur.ts) lastArm.set(t, { opcion: ev.opcion, ts });
      if (ev.opcion === "AP") {
        const cs = startArm.get(t);
        if (!cs || ts > cs.ts) startArm.set(t, { legajo: leg, ts });
      }
    }
  }
  const statusMap = new Map();
  const tandas = new Set([...lastPick.keys(), ...lastArm.keys()]);
  for (const t of tandas) {
    const p = lastPick.get(t);
    const a = lastArm.get(t);
    const sp = startPick.get(t);
    const sa = startArm.get(t);
    statusMap.set(t, {
      picking:  !p ? null : (p.opcion === "TP"  ? "done" : "curso"),
      separado: !a ? null : (a.opcion === "TAP" ? "done" : "curso"),
      doneTodayP: false,
      doneTodayA: false,
      pickLegajo: sp ? sp.legajo : null,
      sepLegajo:  sa ? sa.legajo : null
    });
  }

  // Procesar B:
  //   - HOY: marcar TP/TAP en statusMap + recolectar alertas off-sheet
  //   - TODOS los días: armar perDay (dayKey -> Set<tanda> TP y Set<tanda> TAP)
  //     para alimentar las filas de los días anteriores en el monitor.
  const alertasSet = new Set();
  const perDay = new Map();   // dayKey -> { donePSet, doneASet }
  for (const ev of dataB) {
    const t = (ev.texto || "").trim().toUpperCase();
    if (!t) continue;
    const tsMs = new Date(ev.ts_cliente).getTime();
    const dayKey = isoToDayKey(tsMs);

    // Acumulador por día (incluye hoy + 5 anteriores)
    if (!perDay.has(dayKey)) perDay.set(dayKey, { donePSet: new Set(), doneASet: new Set() });
    const dayAgg = perDay.get(dayKey);
    if (ev.opcion === "TP")  dayAgg.donePSet.add(t);
    if (ev.opcion === "TAP") dayAgg.doneASet.add(t);

    // Lógica de HOY (existente): alerts off-sheet y done-today en statusMap.
    if (tsMs >= startTodayMs && tsMs < endTodayMs) {
      if (!sheetMap.has(t)) {
        alertasSet.add(t);
      } else {
        const s = statusMap.get(t);
        if (s) {
          if (ev.opcion === "TP")  s.doneTodayP = true;
          if (ev.opcion === "TAP") s.doneTodayA = true;
        }
      }
    }
  }

  // Armar pastDays: los 5 últimos días PRODUCTIVOS (con algún registro), del
  // más reciente al más viejo. Saltea automáticamente domingos/feriados o
  // cualquier día sin actividad. M3 sale del sheetMap actual; si la tanda ya
  // no está, caemos al historicMap.
  const historic = await getHistoricMap();
  const productiveDays = [...perDayLegajos.keys()]
    .filter(d => d < todayKey)         // excluimos hoy
    .sort()
    .reverse()                          // del más reciente al más viejo
    .slice(0, 5);                       // máximo 5
  const pastDays = [];
  for (const dayKey of productiveDays) {
    const [, m, dd] = dayKey.split("-");
    const label = `${dd}/${m}`;
    let totPick = 0, totSep = 0;
    const p = perDay.get(dayKey);
    if (p) {
      for (const tanda of p.donePSet) {
        const entry = sheetMap.get(tanda);
        if (entry) totPick += entry.m3;
        else if (historic.has(tanda)) totPick += historic.get(tanda);
      }
      for (const tanda of p.doneASet) {
        const entry = sheetMap.get(tanda);
        if (entry) totSep += entry.m3;
        else if (historic.has(tanda)) totSep += historic.get(tanda);
      }
    }
    const empleados = perDayLegajos.get(dayKey).size;
    pastDays.push({ key: dayKey, label, totPick, totSep, empleados });
  }

  return { statusMap, alertasOffSheet: [...alertasSet].sort(), empleadosHoy, pastDays, fichadasResumen };
}

function statusIconToday(s) {
  // Solo eventos de HOY. null/undefined -> celda vacía.
  if (s === "done")  return `<span class="status-icon status-done" title="Terminado hoy">✅</span>`;
  if (s === "curso") {
    // 12 barras alrededor del centro, con animation-delay escalonado en
    // -1/12 s para crear el efecto de rotación.
    let bars = "";
    for (let i = 0; i < 12; i++) {
      const delay = (-i / 12).toFixed(3);
      bars += `<rect x="47" y="10" width="6" height="22" rx="2" transform="rotate(${i*30} 50 50)" style="animation-delay:${delay}s"/>`;
    }
    return `<span class="status-icon status-curso status-spinner" title="En curso hoy"><svg viewBox="0 0 100 100">${bars}</svg></span>`;
  }
  return "";
}

/* Legajo del que EMPEZÓ la tanda (EP picking / AP armado). Se posiciona
   absoluto a la derecha de la celda (ver .monitor-legajo en el CSS). Vacío si
   no se conoce el legajo o la celda no tiene estado. */
function monitorLegajoTag(legajo, state) {
  if (!legajo || state == null) return "";
  return `<span class="monitor-legajo" title="Lo empezó el legajo ${escapeHtml(String(legajo))}">${escapeHtml(String(legajo))}</span>`;
}

/* Celda de Picking / Pedido Separado: icono centrado en la columna + legajo
   colgado a la derecha. El wrapper .status-wrap (block, full width) es el
   contexto de posicionamiento para que el legajo no descentre el icono. */
function statusCell(state, legajo) {
  const icon = statusIconToday(state);
  if (!icon) return "";   // sin actividad → celda vacía
  return `<span class="status-wrap">${icon}${monitorLegajoTag(legajo, state)}</span>`;
}

/* Barra compacta encima de los totales del día que muestra cuántos
   empleados fichaste hoy, cuántos siguen en jornada (sin FJ) y cuántos
   cerraron. Si hay fichadas con email no linkeado en Empleados, lo
   marca en naranja como warning. Clickeable: abre el modal del día. */
function renderFichadasBar(resumen, todayKey, todayLabel) {
  if (!resumen || resumen.total === 0 && resumen.sinLegajo === 0) return "";
  const chip = (label, value, color) =>
    `<span style="display:inline-flex;align-items:center;gap:4px;background:${color}1A;color:${color};border:1px solid ${color}55;border-radius:999px;padding:2px 9px;font-weight:600;font-size:0.85em;">${label}: <b>${value}</b></span>`;
  const warn = resumen.sinLegajo > 0
    ? chip("⚠ Sin legajo", resumen.sinLegajo, "#ea580c")
    : "";
  return `
    <div class="monitor-fichadas-bar day-box-clickable"
         data-day-key="${escapeHtml(todayKey)}"
         data-day-label="${escapeHtml(todayLabel)}"
         onclick="showDayBreakdown(this.dataset.dayKey, this.dataset.dayLabel)"
         style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;margin-bottom:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:0.95em;color:#334155;cursor:pointer;">
      <span style="font-weight:700;">Ingresos hoy</span>
      ${chip("Fichados", resumen.total, "#0284c7")}
      ${chip("En jornada", resumen.enJornada, "#16a34a")}
      ${chip("FJ", resumen.cerrados, "#7c3aed")}
      ${warn}
    </div>`;
}

function renderMonitor(sheetMap, statusMap, alertasOffSheet, targetDates, empleadosHoy, pastDays, errMsg, fichadasResumen) {
  // Cacheamos sheetMap para que showTandaDetail() pueda leer los NPs/m3
  // de la tanda clickeada en el modal.
  _monitorSheetCache = sheetMap;
  // Detectar tandas que cambiaron de estado vs el render anterior →
  // se les pinta flash verde y suena un beep.
  const changedTandas = new Set();
  for (const [t, ev] of statusMap) {
    const prev = _prevStatusMap.get(t);
    if (!prev) continue;   // primera vez que aparece, no flashar
    if (prev.picking !== ev.picking || prev.separado !== ev.separado) {
      changedTandas.add(t);
    }
  }
  if (changedTandas.size && _prevStatusMap.size > 0) {
    playMonitorBeep();
  }
  // Snapshot del statusMap actual para el próximo refresh
  _prevStatusMap = new Map();
  for (const [t, ev] of statusMap) _prevStatusMap.set(t, { picking: ev.picking, separado: ev.separado });

  const content = document.getElementById("monitorContent");
  if (errMsg) {
    content.innerHTML = `<div class="monitor-error">${escapeHtml(errMsg)}</div>` + (content.innerHTML || "");
    return;
  }

  // Filtro principal: SOLO tandas cuya Fecha Entrega esté en las próximas 3
  // fechas del sheet (saltea días vacíos: feriados, weekends, sin planificar).
  const targetSet = new Set(targetDates);
  // Reglas de visibilidad:
  //   - Op=SI                                  -> aparece SIEMPRE
  //   - Op vacío + cualquier evento histórico  -> aparece marcado missingSi (rojo)
  //   - Op vacío + sin eventos                 -> NO aparece
  // Status (picking/separado) usa TODOS los eventos históricos de la tanda
  // (no solo hoy) — si EP/TP/AP/TAP existieron antes, el tilde aparece igual.
  const tandas = [];
  for (const [k, v] of sheetMap) {
    if (!targetSet.has(v.fechaEntregaRaw)) continue;
    const ev = statusMap.get(k) || { picking: null, separado: null, doneTodayP: false, doneTodayA: false, pickLegajo: null, sepLegajo: null };
    const hasAny = (ev.picking !== null || ev.separado !== null);
    if (!v.opIsSi && !hasAny) continue;
    tandas.push({ ...v, ev, missingSi: !v.opIsSi });
  }

  // Orden:
  //   rank 0 = algo en curso (⏰)
  //   rank 1 = incompleta (1 done + 1 vacío)
  //   rank 2 = planificada sin actividad
  //   rank 3 = doble ✅
  const rankRow = (ev) => {
    const hasCurso = (ev.picking === "curso" || ev.separado === "curso");
    const bothDone = (ev.picking === "done"  && ev.separado === "done");
    const noActivity = (ev.picking === null && ev.separado === null);
    if (hasCurso) return 0;
    if (bothDone) return 3;
    if (noActivity) return 2;
    return 1;
  };
  // FE más cercana primero → urgencia → alfabético
  tandas.sort((a,b) =>
    a.fechaEntregaRaw.localeCompare(b.fechaEntregaRaw) ||
    (rankRow(a.ev) - rankRow(b.ev)) ||
    a.tanda.localeCompare(b.tanda)
  );

  // Totales del día (M3 TERMINADOS HOY: TP/TAP de hoy) — alimentan los
  // cajones grandes "M3 Picking del día" y "M3 Pedido del día".
  // tandasFC = picking Y separado completados → van al panel "Tandas a FC".
  // Total por día de entrega — SOLO suma las que están en FC, no todas las
  // planificadas (alimenta el cuadro "Total por día" a la derecha).
  let totPickToday = 0, totSepToday = 0;
  let rowsHtml = "";
  const tandasFC = [];
  const totalByDate = new Map();   // fechaRaw -> { fechaDisplay, totalSum, byCamion }

  for (const t of tandas) {
    const ev = t.ev;
    if (!t.missingSi) {
      if (ev.doneTodayP) totPickToday += t.m3;
      if (ev.doneTodayA) totSepToday  += t.m3;
    }
    // Total por día — desglosado por camión (cada número de tanda agrupa
    // las que comparten el mismo número: C03A + C03B = camión 03).
    {
      const key = t.fechaEntregaRaw || "_";
      if (!totalByDate.has(key)) {
        totalByDate.set(key, {
          fechaDisplay: t.fechaEntrega,
          totalSum: 0,
          byCamion: new Map()   // camion -> { sum, tandas[], tandasArmadas }
        });
      }
      const g = totalByDate.get(key);
      g.totalSum += t.m3;
      const cam = tandaCamion(t.tanda);
      if (!g.byCamion.has(cam)) g.byCamion.set(cam, { sum: 0, tandas: [], tandasArmadas: 0 });
      const c = g.byCamion.get(cam);
      c.sum += t.m3;
      c.tandas.push({ code: t.tanda, m3: t.m3, armado: ev.separado === "done" });
      if (ev.separado === "done") c.tandasArmadas++;
    }
    const bothDone = (ev.picking === "done" && ev.separado === "done");
    if (bothDone && !t.missingSi) {
      tandasFC.push(t);
      continue;       // las terminadas no van a la tabla principal
    }
    const isCurso = (ev.picking === "curso" || ev.separado === "curso");
    const cls = [];
    if (isCurso)        cls.push("row-curso");
    if (t.missingSi)    cls.push("row-missing-si");
    if (changedTandas.has(t.tanda.toUpperCase())) cls.push("row-flash");
    const m3Txt = t.m3.toFixed(1).replace(".", ",");
    const feTxt = t.missingSi
      ? `${escapeHtml(t.fechaEntrega)}<br>(F Pk)`
      : escapeHtml(t.fechaEntrega);
    rowsHtml += `
      <tr class="${cls.join(" ")}">
        <td class="monitor-tanda tanda-clickable" data-tanda="${escapeHtml(t._key || t.tanda)}" onclick="showTandaDetail(this.dataset.tanda)">${escapeHtml(t.tanda)}</td>
        <td class="num">${m3Txt}</td>
        <td class="center">${feTxt}</td>
        <td class="center">${statusCell(ev.picking, ev.pickLegajo)}</td>
        <td class="center">${statusCell(ev.separado, ev.sepLegajo)}</td>
      </tr>`;
  }
  const todayStr = new Date().toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" });
  const todayKey = isoToDayKey(Date.now());   // YYYY-MM-DD para showDayBreakdown
  const fmtDM = (raw) => { const [, m, d] = raw.split("-"); return `${d}/${m}`; };
  const targetLabel = targetDates.length
    ? targetDates.map(fmtDM).join(", ")
    : "—";
  const alertHtml = alertasOffSheet.length ? `
    <div class="monitor-alerts">
      <div class="monitor-alert-title">⚠ Tandas trabajadas que NO están en PPP — alguien se equivocó:</div>
      <div class="monitor-alert-list">
        ${alertasOffSheet.map(t => `<span class="monitor-alert-chip">${escapeHtml(t)}</span>`).join("")}
      </div>
    </div>` : "";
  const leftHtml = rowsHtml ? `
    <table class="monitor-table">
      <thead>
        <tr>
          <th>Tanda</th>
          <th class="num">M3</th>
          <th class="center">Fecha<br>Salida</th>
          <th class="center">Picking</th>
          <th class="center">Pedido<br>Separado</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  ` : (tandas.length
        ? `<div class="monitor-loading">Todas las tandas terminadas para ${targetLabel} ✅</div>`
        : `<div class="monitor-loading">Sin tandas planificadas para las próximas fechas (${targetLabel}).</div>`);

  // Panel "Tandas a FC" — tandas con picking + separado completados.
  const totalFcM3 = tandasFC.reduce((s, t) => s + (t.m3 || 0), 0);
  const fcHtml = tandasFC.length ? `
    <div class="monitor-fc-card">
      <div class="monitor-fc-title">Tandas a FC (${totalFcM3.toFixed(1).replace(".", ",")} m3)</div>
      <table class="monitor-fc-table">
        <thead>
          <tr>
            <th>Tanda</th>
            <th class="num">M3</th>
            <th class="center">Fecha Salida</th>
          </tr>
        </thead>
        <tbody>
          ${tandasFC.map(t => `
            <tr>
              <td class="fc-tanda tanda-clickable" data-tanda="${escapeHtml(t._key || t.tanda)}" onclick="showTandaDetail(this.dataset.tanda)">${escapeHtml(t.tanda)}</td>
              <td class="num">${t.m3.toFixed(1).replace(".", ",")}</td>
              <td class="center">${escapeHtml(t.fechaEntrega)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  ` : "";

  // Card "+ Fuera de ventana" — tandas planificadas (Op=SI) cuya fecha de
  // entrega es POSTERIOR a la última fecha de la ventana visible. Cuenta
  // cuántas tandas y cuántos m3 quedaron sin mostrar, agrupados por fecha.
  const maxTarget = targetDates.length ? targetDates[targetDates.length - 1] : "";
  const beyondByDate = new Map();
  let beyondTotalTandas = 0;
  let beyondTotalM3 = 0;
  for (const [, v] of sheetMap) {
    if (!v.opIsSi || !v.fechaEntregaRaw) continue;
    if (!maxTarget || v.fechaEntregaRaw <= maxTarget) continue;
    if (!beyondByDate.has(v.fechaEntregaRaw)) {
      beyondByDate.set(v.fechaEntregaRaw, { fechaDisplay: v.fechaEntrega, tandas: [], sumM3: 0 });
    }
    const g = beyondByDate.get(v.fechaEntregaRaw);
    g.tandas.push(v.tanda);
    g.sumM3 += v.m3;
    beyondTotalTandas++;
    beyondTotalM3 += v.m3;
  }
  const beyondHtml = beyondTotalTandas > 0 ? `
    <div class="beyond-card${beyondExpanded ? ' expanded' : ''}" onclick="toggleBeyondDetail()">
      <div class="beyond-summary">
        <span class="beyond-label">+ Fuera de ventana:</span>
        <span class="beyond-count">${beyondTotalTandas} tandas · ${beyondTotalM3.toFixed(1).replace(".", ",")} m3</span>
        <span class="beyond-toggle">▼</span>
      </div>
      <div class="beyond-detail">
        ${[...beyondByDate.entries()].sort().map(([, g]) => `
          <div class="beyond-day">
            <div class="beyond-day-header">${escapeHtml(g.fechaDisplay)} · ${g.tandas.length} tandas · ${g.sumM3.toFixed(1).replace(".", ",")} m3</div>
            <div class="beyond-day-tandas">${g.tandas.sort().map(t => escapeHtml(t)).join(", ")}</div>
          </div>
        `).join("")}
      </div>
    </div>
  ` : "";

  // Cuadro "Total por día" — m3 de tandas del día, desglosado por camión
  // (cada número de tanda agrupa las que comparten el mismo número: C03A +
  // C03B = camión 03). Fecha y Total se mergean (rowspan) cuando hay varios
  // camiones en el mismo día.
  _monitorTotalCache = totalByDate;   // para que showCamionDetail() pueda leerlo
  const totalEntries = [...totalByDate.entries()].sort();
  const totalHtml = totalEntries.length ? `
    <div class="monitor-total-card">
      <div class="monitor-total-title">Total por día</div>
      <table class="monitor-total-table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th class="center">Camión</th>
            <th class="num">M3</th>
            <th class="num">Total</th>
          </tr>
        </thead>
        <tbody>
          ${totalEntries.map(([dateKey, g]) => {
            const camions = [...g.byCamion.entries()].sort((a, b) => a[0].localeCompare(b[0]));
            const n = camions.length || 1;
            const totalCell = `<td class="num total-cell" rowspan="${n}">${g.totalSum.toFixed(1).replace(".", ",")}</td>`;
            const fechaCell = `<td class="fecha-cell" rowspan="${n}">${escapeHtml(g.fechaDisplay)}</td>`;
            if (!camions.length) {
              return `<tr>${fechaCell}<td></td><td class="num"></td>${totalCell}</tr>`;
            }
            return camions.map(([cam, c], i) => {
              // Color del camión según cuántas de sus tandas están armadas:
              //   todas → verde · algunas → naranja · ninguna → rojo
              const armadas = c.tandasArmadas;
              const total   = c.tandas.length;
              const statusClass = armadas === 0
                ? "tandas-pending"
                : (armadas >= total ? "tandas-done" : "tandas-partial");
              return `
                <tr class="${statusClass}">
                  ${i === 0 ? fechaCell : ""}
                  <td class="center cam-cell tanda-clickable" data-date="${escapeHtml(dateKey)}" data-cam="${escapeHtml(cam)}" onclick="showCamionDetail(this.dataset.date, this.dataset.cam)">${escapeHtml(cam)}</td>
                  <td class="num">${c.sum.toFixed(1).replace(".", ",")}</td>
                  ${i === 0 ? totalCell : ""}
                </tr>
              `;
            }).join("");
          }).join("")}
        </tbody>
      </table>
    </div>
  ` : "";

  // Leyenda de legajos abajo del monitor: "Leg 8: Juan Farias".
  const legajosVistos = new Set();
  for (const t of tandas) {
    if (t.ev.pickLegajo) legajosVistos.add(String(t.ev.pickLegajo));
    if (t.ev.sepLegajo)  legajosVistos.add(String(t.ev.sepLegajo));
  }
  const legendHtml = legajosVistos.size ? `
    <div class="monitor-legend">
      <div class="legend-title">Operarios en pantalla</div>
      ${[...legajosVistos]
          .sort((a,b) => (parseInt(a,10)||0) - (parseInt(b,10)||0))
          .map(l => `<span class="legend-item"><b>Leg ${escapeHtml(l)}:</b> ${escapeHtml(_empleadosNombres.get(l) || "—")}</span>`)
          .join("")}
    </div>` : "";

  const tableHtml = `
    <div class="monitor-flex">
      <div class="monitor-table-wrap">
        ${leftHtml}
        ${beyondHtml}
        ${legendHtml}
      </div>
      <div class="monitor-totales monitor-totales-side">
        <div class="totales-col-boxes">
          ${renderFichadasBar(fichadasResumen, todayKey, todayStr)}
          <div class="totales-row">
            <div class="monitor-tot-box day-box-clickable" data-day-key="${escapeHtml(todayKey)}" data-day-label="${escapeHtml(todayStr)}" onclick="showDayBreakdown(this.dataset.dayKey, this.dataset.dayLabel)">
              <div class="monitor-tot-label">M3 Picking<br>del día ${todayStr}</div>
              <div class="monitor-tot-value">${totPickToday.toFixed(1).replace(".", ",")}</div>
            </div>
            <div class="monitor-tot-box day-box-clickable" data-day-key="${escapeHtml(todayKey)}" data-day-label="${escapeHtml(todayStr)}" onclick="showDayBreakdown(this.dataset.dayKey, this.dataset.dayLabel)">
              <div class="monitor-tot-label">M3 Pedido<br>del día ${todayStr}</div>
              <div class="monitor-tot-value">${totSepToday.toFixed(1).replace(".", ",")}</div>
            </div>
            <div class="monitor-tot-box day-box-clickable" data-day-key="${escapeHtml(todayKey)}" data-day-label="${escapeHtml(todayStr)}" onclick="showDayBreakdown(this.dataset.dayKey, this.dataset.dayLabel)">
              <div class="monitor-tot-label">Empleados<br>Hoy</div>
              <div class="monitor-tot-value">${empleadosHoy != null ? empleadosHoy : "—"}</div>
            </div>
          </div>
          ${(pastDays || []).map(d => `
            <div class="totales-row">
              <div class="monitor-tot-box day-box-clickable" data-day-key="${escapeHtml(d.key)}" data-day-label="${escapeHtml(d.label)}" onclick="showDayBreakdown(this.dataset.dayKey, this.dataset.dayLabel)">
                <div class="monitor-tot-label">M3 Picking<br>del día ${escapeHtml(d.label)}</div>
                <div class="monitor-tot-value">${d.totPick.toFixed(1).replace(".", ",")}</div>
              </div>
              <div class="monitor-tot-box day-box-clickable" data-day-key="${escapeHtml(d.key)}" data-day-label="${escapeHtml(d.label)}" onclick="showDayBreakdown(this.dataset.dayKey, this.dataset.dayLabel)">
                <div class="monitor-tot-label">M3 Pedido<br>del día ${escapeHtml(d.label)}</div>
                <div class="monitor-tot-value">${d.totSep.toFixed(1).replace(".", ",")}</div>
              </div>
              <div class="monitor-tot-box day-box-clickable" data-day-key="${escapeHtml(d.key)}" data-day-label="${escapeHtml(d.label)}" onclick="showDayBreakdown(this.dataset.dayKey, this.dataset.dayLabel)">
                <div class="monitor-tot-label">Empleados<br>${escapeHtml(d.label)}</div>
                <div class="monitor-tot-value">${d.empleados}</div>
              </div>
            </div>
          `).join("")}
        </div>
        <div class="totales-col-fc">
          ${fcHtml}
          ${totalHtml}
        </div>
        ${alertHtml}
      </div>
    </div>
  `;
  content.innerHTML = tableHtml;
  const countCurso = tandas.filter(t => t.ev.picking === "curso" || t.ev.separado === "curso").length;
  document.getElementById("monitorMeta").textContent =
    `${tandas.length} tanda(s) entrega ${targetLabel} · ${countCurso} en curso · ${tandasFC.length} a FC · eventos ${MONITOR_REFRESH_MS/1000}s · PPP ${PPP_TTL_MS/1000}s`;
}

async function refreshMonitor() {
  const refrEl = document.getElementById("monitorRefresh");
  try {
    // 1) Sheet primero (necesitamos target dates + tandas para query de eventos).
    //    Cacheado por PPP_TTL_MS para no martillar Google Sheets en cada tick
    //    de 1s — refresca recién cuando el cache expira (3s default).
    const nowMs = Date.now();
    let sheetMap;
    if (_pppCache && (nowMs - _pppCacheTs) < PPP_TTL_MS) {
      sheetMap = _pppCache;
    } else {
      sheetMap = await fetchMonitorSheet();
      _pppCache = sheetMap;
      _pppCacheTs = Date.now();
    }
    // Fetcheamos siempre la ventana ANCHA (7 días futuros + pasados) así
    // tenemos eventos para todas las tandas que potencialmente se muestran.
    const wideTargetDates = targetDeliveryDates(sheetMap, 7);
    const wideTargetSet   = new Set(wideTargetDates);
    const targetTandaKeys = [];
    for (const [k, v] of sheetMap) {
      if (wideTargetSet.has(v.fechaEntregaRaw)) targetTandaKeys.push(k);
    }
    // 2) Eventos: status por tanda + alertas de hoy + empleados de hoy + 5 días anteriores
    const { statusMap, alertasOffSheet, empleadosHoy, pastDays, fichadasResumen } = await fetchMonitorEvents(targetTandaKeys, sheetMap);
    monitorLastOkTs = Date.now();
    // 3) Decidir cuántos días mostrar: por default los próximos 3, pero si
    //    quedan ≤ 3 tandas activas (sin TAP confirmado), expandimos a 7 para
    //    que el supervisor pueda planear adelante.
    const narrowDates = targetDeliveryDates(sheetMap, 3);
    const narrowSet   = new Set(narrowDates);
    let activeInNarrow = 0;
    for (const [k, v] of sheetMap) {
      if (!narrowSet.has(v.fechaEntregaRaw)) continue;
      if (!v.opIsSi) continue;
      const ev = statusMap.get(k) || {};
      if (ev.picking === "done" && ev.separado === "done") continue;
      activeInNarrow++;
    }
    const targetDates = activeInNarrow <= 3 ? wideTargetDates : narrowDates;
    await getEmpleadosNombres();   // legajo -> nombre para la leyenda (cacheado 1h)
    renderMonitor(sheetMap, statusMap, alertasOffSheet, targetDates, empleadosHoy, pastDays, null, fichadasResumen);
    if (refrEl) { refrEl.textContent = "● al día"; refrEl.classList.remove("stale"); }
    // Si el fetch anda, ocultar banner offline (puede que estuviera mostrándose).
    document.getElementById("monitorOfflineBanner")?.classList.add("hidden");
  } catch (e) {
    if (refrEl) {
      const ageSec = monitorLastOkTs ? Math.round((Date.now()-monitorLastOkTs)/1000) : -1;
      refrEl.textContent = monitorLastOkTs
        ? `● desactualizado (${ageSec}s) — ${e.message}`
        : `● error: ${e.message}`;
      refrEl.classList.add("stale");
    }
    // Banner amarillo bien visible — mantenemos el último estado en pantalla.
    const offlineBanner = document.getElementById("monitorOfflineBanner");
    if (offlineBanner) {
      if (monitorLastOkTs) {
        const d = new Date(monitorLastOkTs);
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        offlineBanner.textContent = `⚠ Sin conexión — datos al ${hh}:${mm} (${Math.round((Date.now()-monitorLastOkTs)/1000)}s)`;
        offlineBanner.classList.remove("hidden");
      } else {
        offlineBanner.classList.add("hidden");
      }
    }
    if (!monitorLastOkTs) {
      document.getElementById("monitorContent").innerHTML =
        `<div class="monitor-error">No se pudo cargar: ${escapeHtml(e.message)}</div>`;
    }
  }
}
</script>

</body>
</html>
